# eval run 2, RocksDB N = 4 / 8 (VM8 topology), u5 (5 % updates) only, hw / pop / ds (experiment de-stijl-evaluation-run2).
# = eval-run2-rocks-n48.conf (block E cells: 54M keys over the N VMs, SLO p99 1 ms, cxl_vm0..N-1 at 4 vCPU / 24 GB,
# builds/rocksdb/4, w50 receiver adaptive ipoll=0 watch_us=50 s_max_us=50, fault_poll=0, pmax step, run-1 ladder) with
# ONLY these keys changed: ROCKS_MIXES u5 (the N = 2 u5 cell of eval-run2-rocks.conf: UPDATE_RATIO 0.05, same keys /
# threads / SLO / ROCKS_SLO_EXTRA), EVIDENCE_PREFIX eval-run2-u5 and ROCKS_GUEST_PREFIX .../rocksdb4-run2-u5 (u5
# evidence never shares a name with the u50 block E dirs recovery/eval-run2-E-<phase>-n<N>-v<k>), ROCKS_PMAX_FROM the
# u5 hwpop dirs. Evidence: recovery/eval-run2-u5-E-<phase>-n<N>-v<k> (k = run, retry k + 3; RK2 convention).
# usage: runset-rocks.sh experiments/rocksdb/eval-run2-rocks-u5-n48.conf <4|8> hwpop|ds
# Chain: workspaces/de-stijl-evaluation-run2-rocks-u5-n48-chain-v1.sh runs pop-u5 from this conf (--only pop-u5), hw-u5
# from a resolved hw-only copy (EVIDENCE_PREFIX eval-run2-u5-hw: recovery/eval-run2-u5-hw-E-hwpop-n<N>-v<V>) and ds-u5
# from a resolved copy (DS_* = the build-10 topo-8 bundle of each N, ROCKS_PMAX_FROM = this run's u5 hwpop versions).
