# eval run 2, RocksDB fault_poll exploration at N = 2 (experiment de-stijl-evaluation-run2, widening approved 2026-11-05
# ~02:xx, state/EXPERIMENTS.md; user 2026-11-05: add N = 2 u50 to the fault_poll exploration). Exploratory: a decision
# input, not a figure. = eval-run2-rocks.conf (2-VM topology cxl_vm0/1, 4 vCPU, 54 M keys, 4 threads, receiver A =
# adaptive ipoll=0 watch_us=50 s_max_us=50, De Stijl loaded with fault_poll=0) except: ROCKS_BLOCK ABL, ROCKS_MIXES u50,
# ROCKS_SYSTEMS pop ds, ROCKS_PMAX 0 (no SLO search), ROCKS_BUILD builds/rocksdb/8 (= rocksdb/4 sources + the per-step
# RCA counter export of proc_stats.h, as eval-run2-rocks-fpx-n4.conf), names, and the ROCKS_FIXED* keys: ONE server
# lifetime per system, a warm part (5000 total ops/s, base, not used) then fixed-rate parts of 3 steps x (10 s step
# warm-up + 30 s measured) + 5 s drain at 500, 3700, 20000 and 28800 (run-1 shared rate) total ops/s:
#   pop   r<rate>                Popcorn 13 (13-recv2 module), reference, no fault_poll parameter
#   ds    fp0r<rate> fp1r<rate>  De Stijl build 10, fault_poll 0 (= the base, the load value) and 1 (written at runtime
#                                before the part on both VMs, read back; restored to 0 and checked after), interleaved
# usage: runset-rocks.sh <this> 2 hwpop (pop) | the chain's resolved copy (DS_* = the deployed build-10 bundle) 2 ds.
# Evidence recovery/eval-run2-fpx-ABL-{hwpop,ds}-n2-v<V>. Chain:
# workspaces/de-stijl-evaluation-run2-faultpoll-n2-chain-v1.sh.
