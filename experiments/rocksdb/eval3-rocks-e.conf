# eval3 block E, RocksDB part (experiment de-stijl-evaluation-run1, schedule §4 scalability = motivation H2): RocksDB
# u50 (50:50 YCSB) at N = 4 and N = 8 VMs of the VM8 topology (cxl_vm0..N-1, 4 vCPU / 24 GB each; workspaces/vmN-chain-
# v3.sh VMN_TOPO=8), hw / pop / ds (De Stijl T = 0: rocksdb-server has no staleness hook), max requests/s under the
# SLO p99 1 ms (one aggregate SLO search per cell; request targets uniform over the N VMs). No Megalon at N > 2.
# N = 2 point = block D's u50 cells (eval3-rocks-d.conf). Same search rule, builds and keys as block D.
# usage: runset-rocks.sh experiments/rocksdb/eval3-rocks-e.conf <4|8> hwpop|ds [--dry-run]
#
# Re-pin recipes (mechanical, no user decision): as eval3-rocks-d.conf. Popcorn: the N-node bundle must cover vm0..vm7
# (build 13 deploy-v1 does; build-12 fallback POP_C=workspaces/popcorn-n/bundle-n-v2 POP_BUNDLE_SHA=88692448ee78...
# POP_K=6.14.0-famfs-de-stijl+-ds-popcorn-new-12 POP_GT=/home/comsys/popcorn-12n). De Stijl: DS_C = the 8-VM bundle
# (vm2..vm7 deploy dirs; ds-bundles item, builds/destijl/7/deploy-v6+) that is deployed, DS_BUNDLE_SHA = sha256 of its
# packet.sha256; deploy-v5 below only covers vm0/vm1 and serves the dry run.
ROCKS_BLOCK=E
ROCKS_TOPO=8
ROCKS_NODES="4 8"
ROCKS_MIXES="u50"
ROCKS_SYSTEMS="hw pop ds"
ROCKS_SLO_MS=1
ROCKS_KEYS=54000000                      # as the H3 N = 4 / 8 runs of 2026-10-19 (54M keys total, split over the N VMs)
ROCKS_THREADS=4
EXPECT_NPROC=4
MIN_MEM_G=16
ROCKS_BUILD=builds/rocksdb/4
ROCKS_LOADGEN_BUILD=builds/rocksdb-loadgen/2
ROCKS_SLO_EXTRA="--confirm-rule pooled --confirm-full --confirm-reps 1 --confirm-s 90 --confirm-warmup-s 15 --overload-base result --overload 0.9,0.92,0.94,0.96,0.98,1.02,1.05,1.1,1.15,1.2,1.3,1.5,2.0 --start-fail-steps 1.25,1.5,2,2.5,3.4"
RECV_MODE=sleep
EXPECT_DAX_UUID=45fd85d6-724d-4eee-8aad-d5152add019d
RESULTS_ROOT=recovery
EVIDENCE_PREFIX=eval3
ROCKS_GUEST_PREFIX=/home/comsys/rocksdb4-eval3
POP_REGION=CXL_SWMC/config/cxl_region-ring2m.yaml   # 2 MiB ring: 1024 / 256 slots per window at N = 4 / 8
POP_C=builds/popcorn_new/13/deploy-v1
POP_BUNDLE_SHA=26e145152f872db4eef0c4ee200f03264a3a9d8286ea543683792760f6be0752
POP_K=6.14.0-famfs-de-stijl+-ds-popcorn-new-13
