# eval run2 block MG (experiment de-stijl-evaluation-run2, design doc §2.5 Q8 "Megalon on RocksDB"): RocksDB u5 (95:5)
# and u50 (50:50) YCSB mixes x mg (Object SWcc = Megalon, user level; object = one 1 MiB memtable arena block / file
# extent, workloads/rocksdb/DESIGN.md §7), SLO p99 1 ms on the mixed request stream. Same keys, threads, loadgen build,
# SLO search arguments, region config and guest kernel as the hw cells of eval3-rocks-d.conf (block D, run 1);
# 2-VM topology: cxl_vm0/cxl_vm1 (16 vCPU / 96 GB XML, guest CPUs 4-15 offline = 4 vCPU).
# usage: runset-rocks.sh experiments/rocksdb/eval-run2-rocks-mg.conf 2 mg [--dry-run]
# N = 4 / 8 (later): set ROCKS_TOPO=8, ROCKS_NODES="4 8" and ROCKS_MG_{BUILD,CFG,EXTENTS}_N4/_N8 (rocksdb builds on
# builds/megalon/78-n4 / 78-n8, Megalon configs with object_arena_size >= N x (512 + extents) MiB).
ROCKS_BLOCK=MG
ROCKS_TOPO=2
ROCKS_NODES="2"
ROCKS_MIXES="u5 u50"
ROCKS_SYSTEMS="mg"
ROCKS_SLO_MS=1
ROCKS_KEYS=54000000
ROCKS_THREADS=4
EXPECT_NPROC=4
MIN_MEM_G=16
ROCKS_BUILD=builds/rocksdb/4             # hw/pop/ds build (unused in phase mg; the key is required)
ROCKS_LOADGEN_BUILD=builds/rocksdb-loadgen/2
ROCKS_SLO_EXTRA="--confirm-rule pooled --confirm-full --confirm-reps 1 --confirm-s 90 --confirm-warmup-s 15 --overload-base result --overload 0.9,0.92,0.94,0.96,0.98,1.02,1.05,1.1,1.15,1.2,1.3,1.5,2.0 --start-fail-steps 1.25,1.5,2,2.5,3.4"
RECV_MODE=sleep                          # Popcorn / De Stijl only (unused by mg; the key is required)
EXPECT_DAX_UUID=45fd85d6-724d-4eee-8aad-d5152add019d
RESULTS_ROOT=recovery
EVIDENCE_PREFIX=eval-run2
ROCKS_GUEST_PREFIX=/home/comsys/rocksdb7-run2
ROCKS_EXPERIMENT=de-stijl-evaluation-run2
# Megalon: rocksdb build 7 = build.sh at 9f080349c, clean tree (dirty_files=0; verifier LOW-1 mem_read tail fix) with
# builds/megalon/78-n2 (the N = 2 Megalon library of the vector DB run-1 mg
# cells); 45000 file extents + 512 arena blocks per node (91024 MiB of objects <= object_arena_size 90 GiB; image
# 26992 extents per node at 54M keys, so ~18000 extents stay free, stop floor 2048)
ROCKS_MG_BUILD_N2=builds/rocksdb/7
ROCKS_MG_CFG_N2=CXL_SWMC/workloads/rocksdb/config/megalon-2vm.yaml
ROCKS_MG_EXTENTS_N2=45000
# guest kernel and region of the hw cells (POP_K, POP_REGION); the Popcorn bundle keys are required by the conf parser
POP_REGION=CXL_SWMC/config/cxl_region-ring2m.yaml
POP_C=builds/popcorn_new/13/deploy-v2
POP_BUNDLE_SHA=60baa46ba48b5e0d7dab2dd0c3c43f51cd52c60e9ac3be6e1332237db7eb2dec
POP_K=6.14.0-famfs-de-stijl+-ds-popcorn-new-13
POP_GT=/home/comsys/popcorn-13
DS_REGION=CXL_SWMC/config/cxl_region-destijl.yaml
DS_C=builds/destijl/7/deploy-v7
DS_BUNDLE_SHA=589e2ec0c2065d897b34e0d5c05e2b5e934629831b8eb03c821c44b9611e02f9
DS_K=6.14.0-famfs-de-stijl+-ds-destijl-7
