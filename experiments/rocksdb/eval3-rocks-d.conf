# eval3 block D (experiment de-stijl-evaluation-run1, schedule §2 "RocksDB, 2 hosts"): RocksDB u5 (95:5) and u50 (50:50)
# YCSB mixes x hw / pop / ds (De Stijl T = 0), SLO p99 1 ms on the mixed request stream, no Megalon (user decisions
# 2026-11-01 §5 items 4). 2-VM topology: cxl_vm0/cxl_vm1 (16 vCPU / 96 GB XML, guest CPUs 4-15 offline = 4 vCPU).
# usage: runset-rocks.sh experiments/rocksdb/eval3-rocks-d.conf 2 hwpop|ds [--dry-run]
#
# Re-pin recipes (mechanical, no user decision):
# - Popcorn fallback to build 12 (if build 13 is not the deployed kernel): POP_C=workspaces/popcorn-n/bundle-n-v2
#   POP_BUNDLE_SHA=88692448ee780398254b5683f07af35769dc1156d778cd50def0b049a1505436
#   POP_K=6.14.0-famfs-de-stijl+-ds-popcorn-new-12 POP_GT=/home/comsys/popcorn-12n (same region ring2m).
#   POP_BUNDLE_SHA is always `sha256sum < $POP_C/packet.sha256`.
# - De Stijl: each redeploy uses a new bundle dir (p-destijl-bundle.sh, made by the block chain); DS_C below only
#   provides p-destijl-shm.sh (identical in every build-7 bundle), so it stays deploy-v7; DS_BUNDLE_SHA =
#   `sha256sum < $DS_C/packet.sha256`; DS_K and DS_GT stay unless the bundle record says otherwise.
# - POP_GT: guest tools dir of the build-13 tools install = /home/comsys/popcorn-13 (eval3-pop13-deploy-chain-v2.sh).
ROCKS_BLOCK=D
ROCKS_TOPO=2
ROCKS_NODES="2"
ROCKS_MIXES="u5 u50"
ROCKS_SYSTEMS="hw pop ds"
ROCKS_SLO_MS=1
ROCKS_KEYS=54000000                      # as the N = 2 u5 search of 2026-10-18 (27M keys per node at N = 2)
ROCKS_THREADS=4                          # server request workers per node (= 4 vCPU)
EXPECT_NPROC=4
MIN_MEM_G=16
ROCKS_BUILD=builds/rocksdb/4             # e40bc920a (= current sources): proc_stats.h with the De Stijl counters; same binary for hw/pop/ds
ROCKS_LOADGEN_BUILD=builds/rocksdb-loadgen/2   # 2974a2e51: loadgen with pooled confirm / overload-base / start-fail steps
# Vector DB cell rule (eval2-h2-54m.conf H2N_LOADGEN_EXTRA, runs 1-3): pooled single 90 s confirm after a 15 s warm-up,
# 13 overload points at 0.90-2.0 x the confirmed max (past the knee), 5 start-fail points. The ramp keeps the RocksDB
# search of 2026-10-18 (start 500 req/s, factor 1.5, max 25 steps, fill 0.7/0.8/0.9).
ROCKS_SLO_EXTRA="--confirm-rule pooled --confirm-full --confirm-reps 1 --confirm-s 90 --confirm-warmup-s 15 --overload-base result --overload 0.9,0.92,0.94,0.96,0.98,1.02,1.05,1.1,1.15,1.2,1.3,1.5,2.0 --start-fail-steps 1.25,1.5,2,2.5,3.4"
RECV_MODE=sleep                          # user 2026-10-20 22:3x: recv_mode=sleep for all runs (pop and ds)
EXPECT_DAX_UUID=45fd85d6-724d-4eee-8aad-d5152add019d   # devdax restore v4 (2026-11-01)
RESULTS_ROOT=recovery
EVIDENCE_PREFIX=eval3
ROCKS_GUEST_PREFIX=/home/comsys/rocksdb4-eval3   # + -<block>-<phase>-n<N>-v<V>: a new guest install dir per block
POP_REGION=CXL_SWMC/config/cxl_region-ring2m.yaml
POP_C=builds/popcorn_new/13/deploy-v2   # deployed on both VMs (eval3-pop13-deploy-chain-v2.sh; deploy-v1 never installed)
POP_BUNDLE_SHA=60baa46ba48b5e0d7dab2dd0c3c43f51cd52c60e9ac3be6e1332237db7eb2dec
POP_K=6.14.0-famfs-de-stijl+-ds-popcorn-new-13
POP_GT=/home/comsys/popcorn-13          # guest tools dir of the deploy-v2 install
DS_REGION=CXL_SWMC/config/cxl_region-destijl.yaml
# DS_C is used only for p-destijl-shm.sh (pilot-run.sh): byte-identical in every build-7 bundle, so deploy-v7 stays the
# pin whichever deploy-v<n> the block chain deploys (the chain checks p-destijl-shm.sh + tools/ against deploy-v7)
DS_C=builds/destijl/7/deploy-v7
DS_BUNDLE_SHA=589e2ec0c2065d897b34e0d5c05e2b5e934629831b8eb03c821c44b9611e02f9
DS_K=6.14.0-famfs-de-stijl+-ds-destijl-7
DS_GT=/home/comsys/destijl-7
