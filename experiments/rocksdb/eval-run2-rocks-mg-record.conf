# megalon-record (reports/experiments/rocksdb-megalon-record.md): RocksDB u5 and u50 x mg with Object SWcc at the
# read/write granularity (one Megalon object per 1,152 B memtable slot and per 4 KiB file slice) and the 256 MB HWcc record
# area. Everything else as block MG, experiments/rocksdb/eval-run2-rocks-mg.conf (keys, threads, loadgen, SLO arguments,
# region, guest kernel, 2-VM topology). usage: runset-rocks.sh experiments/rocksdb/eval-run2-rocks-mg-record.conf 2 mg [--dry-run]
ROCKS_BLOCK=MGRECORD
ROCKS_TOPO=2
ROCKS_NODES="2"
ROCKS_MIXES="u5 u50"
ROCKS_SYSTEMS="mg"
ROCKS_SLO_MS=1
ROCKS_KEYS=54000000
ROCKS_THREADS=4
EXPECT_NPROC=4
MIN_MEM_G=16
ROCKS_BUILD=builds/rocksdb/4             # hw/pop/ds build (unused in phase mg; the key is required)
ROCKS_LOADGEN_BUILD=builds/rocksdb-loadgen/2
ROCKS_SLO_EXTRA="--confirm-rule pooled --confirm-full --confirm-reps 1 --confirm-s 90 --confirm-warmup-s 15 --overload-base result --overload 0.9,0.92,0.94,0.96,0.98,1.02,1.05,1.1,1.15,1.2,1.3,1.5,2.0 --start-fail-steps 1.25,1.5,2,2.5,3.4"
RECV_MODE=sleep                          # Popcorn / De Stijl only (unused by mg; the key is required)
EXPECT_DAX_UUID=75922dde-047e-41d7-97fb-d379a320ddf0
RESULTS_ROOT=recovery
EVIDENCE_PREFIX=eval-run2
ROCKS_GUEST_PREFIX=/home/comsys/rocksdb9-run2
ROCKS_EXPERIMENT=rocksdb-megalon-record
# Megalon: rocksdb build 9 (patches 0001-0003, megalon-record backend) with builds/megalon/78-n2; pools as block MG: 512 arena
# blocks + 45000 file extents per node = 23,971,840 objects, 95,445,319,680 B <= object_arena_size 95 GiB
ROCKS_MG_BUILD_N2=builds/rocksdb/9
ROCKS_MG_CFG_N2=CXL_SWMC/workloads/rocksdb/config/megalon-2vm-record.yaml
ROCKS_MG_EXTENTS_N2=45000
ROCKS_MG_SERVER_EXTRA="--mg-mem-object-bytes 1152 --mg-file-object-bytes 4096"
# guest kernel and region of the hw cells (POP_K, POP_REGION); the Popcorn bundle keys are required by the conf parser
POP_REGION=CXL_SWMC/config/cxl_region-ring2m.yaml
POP_C=builds/popcorn_new/13-recv2/deploy-v1   # run-2 Popcorn bundle (re-pinned 2026-11-03; unused by phase mg)
POP_BUNDLE_SHA=a614f5ce9e7953d3444ee90b9d26a682f4a6d7d2132d4067b03490932b10389b
POP_K=6.14.0-famfs-de-stijl+-ds-popcorn-new-13
POP_GT=/home/comsys/popcorn-13r2
DS_REGION=CXL_SWMC/config/cxl_region-destijl.yaml
DS_C=builds/destijl/7/deploy-v7
DS_BUNDLE_SHA=589e2ec0c2065d897b34e0d5c05e2b5e934629831b8eb03c821c44b9611e02f9
DS_K=6.14.0-famfs-de-stijl+-ds-destijl-7
DS_GT=/home/comsys/destijl-7
