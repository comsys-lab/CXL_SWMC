# socialgraph-serving run conf (reports/experiments/socialgraph-serving.md §2-3). KEY=value per line (runset-sg.sh reads
# it with sgconf: no shell execution; relative paths are relative to the project root /home/comsys/sungsu/destijl-control).
# Popcorn / receiver keys = the run-2 w50 pin (experiments/eval/eval-run2-vdb.conf, receiver decision 2026-11-04).
# The SG_DS_* bundle keys are build-7 placeholders as in eval-run2-vdb-ds.conf: the chains make the build-10 bundle and
# write a resolved copy (lib-run2-blocks-v2.sh conf_resolve <conf> <dst> SG_DS_).
RUNS=1                                   # 1 run per cell (user 2026-11-11)
RESULTS_ROOT=recovery
EVIDENCE_NAME=socialgraph-{SYS}-{MIX}-n{N}-r{RUN}   # approved scope recovery/socialgraph-<system>-<mix>-n<N>-r<run>-vV
DERIVED_ROOT=workspaces/socialgraph-derived
SEED_BASE=20261111
VCPUS_PER_VM=4
REGION=CXL_SWMC/config/cxl_region-ring2m.yaml   # hw / pop / mg (doc §2 Systems)
EXPECT_DAX_UUID=75922dde-047e-41d7-97fb-d379a320ddf0   # namespace after the 2026-11-08 Host reboot (was 45fd85d6)
POP_K=6.14.0-famfs-de-stijl+-ds-popcorn-new-13
POP_C=builds/popcorn_new/13-recv2/deploy-v1
POP_GT=/home/comsys/popcorn-13r2
POP_BUNDLE_SHA=a614f5ce9e7953d3444ee90b9d26a682f4a6d7d2132d4067b03490932b10389b
RECV_MODE=adaptive
RECV_IPOLL=0
RECV_WATCH_US=50
RECV_S_MAX_US=50
REQUIRE_ADAPTIVE=1
POP_ADAPT_KO=builds/popcorn_new/13-recv2/stage/lib/modules/6.14.0-famfs-de-stijl+-ds-popcorn-new-13/updates/cxl_shm.ko
SG_SYSTEMS="hw pop ds mgc mgr"           # mgc = Megalon 32 MiB chunks, mgr = Megalon one object per record (N = 2 only)
SG_MIXES="rw100 rw470"                   # read:write by request 100:1 and 470:1
SG_NODES="2 4 8"
# Max RPS under SLO (doc §2) = the search's confirm_x_mean with --x-stream feed (completed feed queries / s summed over
# the VMs): sg-results.tsv confirm_x_mean / max_feed_rps_under_slo; max_offered_x_pass is the total offered requests / s.
SG_SLO=feed:99:10                        # feed query p99 <= 10 ms (user 2026-11-11)
# run-2 SLO search rules (eval-run2-vdb.conf H2N_SLO_PART + H2N_LOADGEN_EXTRA) with ONE change: --start 1000 (total
# offered requests/s; the vector DB ramp starts at 10 searches/s). Decided by the user 2026-11-11 (keep 1000 + fallback).
SG_SLO_PART="--mode slo --start 1000 --factor 1.25 --precision 0.02 --confirm-precision 0.01 --max-confirm-probes 6 --confirm-step-down 0.05 --max-steps 40 --warmup-s 10 --step-warmup-s 3 --step-measure-s 15 --confirm-s 30 --confirm-reps 3 --confirm-rule pooled --confirm-full --confirm-reps 1 --confirm-s 90 --confirm-warmup-s 15 --overload-base result --overload 0.9,0.92,0.94,0.96,0.98,1.02,1.05,1.1,1.15,1.2,1.3,1.5,2.0 --start-fail-steps 1.25,1.5,2,2.5,3.4"
# Ramp start fallback (verifier 2026-11-11; ON, user 2026-11-11 "fallback도 켜줘"): 1 = a cell whose ramp fails
# at --start is rerun once (same lifetime) from SG_START_FALLBACK_RATE total requests/s; recorded in the run manifest.
SG_START_FALLBACK=1
SG_START_FALLBACK_RATE=100
# Write routing (verifier 2026-11-11; range, user 2026-11-11 "range로 하고"): mod = owner VM of record slot
# s is s % N (every 4 KiB page of node slots has N writer VMs); range = contiguous slot ranges per VM (TAO shards by id;
# mostly one writer VM per page). Same value for the loadgen (write_route) and the servers (--write-route, layout.h).
SG_WRITE_ROUTE=range
SG_PMAX=1                               # read fault breakdown at Popcorn's max (pop: own slo part; ds: pop row of the same run)
SG_PMAX_FROM="recovery/socialgraph-pop-{MIX}-n{N}-r{RUN}-v*/sg-results.tsv"
SG_CXLBW=1                               # CXL read bandwidth per step (cxl-bw-sampler.sh; a refusal is recorded, not fatal)
SG_READY_TIMEOUT=900
SG_STALE_EVERY=1000                      # 1 in 1,000 records read (doc §2)
SG_PLAIN_BUILD=builds/socialgraph/4      # --write-route (verifier M5)
SG_LOADGEN_BUILD=builds/socialgraph-loadgen/4   # write_route=mod|range; 4 = 3 + WriteResp only on status Ok (21a66dc6f)
SG_IMAGE_HOST=builds/socialgraph-image/1/graph.img
SG_GEN_HOST=builds/socialgraph-image/1/gen.json
SG_IMAGE_GUEST=/home/comsys/sg-image-1/graph.img   # vm0 local disk (node 0 copies it into the region / Megalon loads it)
SG_VPLAIN=/home/comsys/sg4               # guest install of builds/socialgraph/4, ring2m region (hw, pop)
SG_DS_VPLAIN=/home/comsys/sg4ds          # same build, De Stijl region (ds)
SG_DS_C=builds/destijl/7/deploy-v7       # placeholder: chains resolve to the build-10 bundle
SG_DS_BUNDLE_SHA=589e2ec0c2065d897b34e0d5c05e2b5e934629831b8eb03c821c44b9611e02f9
SG_DS_K=6.14.0-famfs-de-stijl+-ds-destijl-7
SG_DS_GT=/home/comsys/destijl-7
SG_DS_REGION=CXL_SWMC/config/cxl_region-destijl.yaml
SG_DS_T_US=1000000                       # T = 1000 ms on the whole graph region (doc §1)
SG_DS_RECV_EXTRA="fault_poll=0"
SG_MG_CHUNK_BYTES=33554432
SG_MG_LIB_N2=builds/megalon/78-n2
SG_MG_LIB_N4=builds/megalon/78-n4
SG_MG_LIB_N8=builds/megalon/78-n8
