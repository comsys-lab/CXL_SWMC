# h3-ds = TEMPLATE for De Stijl v2 on the H3 harness (runset-h3-vdb.sh / runset-h3-rs.sh, N = 4 and 8): one block per
# N and workload with H3_SYSTEMS "hw ds" (hw on the De Stijl guest kernel without cxl_shm: the block's control; pop
# and ds never share a block). Copy of eval.conf; differences: this header, DERIVED_ROOT, REGISTRY, RUNSETS,
# EVIDENCE_PREFIX / EVIDENCE_TAG (evidence recovery/destijl-v2-run<k>-ds-h3-{vdb,rs}-n<N>-v<V>), EXPECT_DAX_UUID
# (devdax restore v3), VDB_PLAIN_BUILD / VDB_VPLAIN (builds/vdb/22: libdestijl), RS_PLAIN_BUILD / RS_VM_PLAIN
# (builds/recsys/14: libdestijl), H3_SYSTEMS, H3_DS_* keys, H3_PINS pins-vdb-ds-h3.sh. RECV_MODE stays poll (eval.conf
# value of the H3 run sets).
# NOT AN APPROVED EXPERIMENT: no state/EXPERIMENTS.md block covers ds measurement runs yet. Before a run: an experiment
# block with this evidence root, guest installs of vdb/22 and recsys/14 (with the De Stijl region config, h3-block.sh
# checks it), the De Stijl guest kernel H3_DS_K on the N VMs. Re-pin to De Stijl build 4: H3_DS_C / H3_DS_BUNDLE_SHA /
# H3_DS_K / H3_DS_GT + the bundle line of pins-vdb-ds-h3.sh.
# ---- eval.conf header ----
# Evaluation run sets, 2-VM part of H1-H2 (reports/experiments/two-workload-evaluation-2vm.md; design
# reports/design/evaluation-pipeline.md rev 3 §3-§4). Single source of every measurement parameter of the run sets.
# Format: KEY=value or KEY="v1 v2" per line, no shell expansion (parsed by evalconf.py for shell and Python).
# Paths without a leading / are relative to the project root P=/home/comsys/sungsu/destijl-control.
# Keys marked [run] are run bookkeeping and are not part of config_sha256; every other key is a measurement key.
# Keys marked [later] are planned to change after run 1 (cuts for runs 2-3, H3 inputs, run-1-only steps): not part of
# config_sha256 (runs 1-3 stay comparable), recorded separately in every manifest ("later:" lines; verifier L5).

# ---- global ----
RUNS=3                                   # [run] number of runs per run set (paper default 3); vector DB cont mode: <= 3
LEVELS_FROM_RUN=1                        # fixed-load levels of runs >= 2 come from this run (cut Q8)
RESULTS_ROOT=recovery                    # [run] raw evidence (immutable)
DERIVED_ROOT=workspaces/destijl-v2-derived/h3-ds   # [run] canonical CSVs: <root>/<workload>/<runset>/run<k>/
REGISTRY=workspaces/destijl-v2-derived/h3-ds-runs.tsv   # [run] this template's runs.tsv (registry.py EVAL_REGISTRY)
RUNSETS="h3-vdb-n4 h3-vdb-n8 h3-rs-n4 h3-rs-n8"   # [run] H3 run sets only
EVIDENCE_PREFIX=destijl-v2               # [run] <RESULTS_ROOT>/destijl-v2-run<k>-ds-<runset>-v<V>
EVIDENCE_TAG=ds                          # [run] runset-h3-*.sh: tag ds-<runset>
SEED_BASE=20261020                       # loadgen seed of run k = SEED_BASE + k (vector DB: H1 hook H1_SEED_BASE)
VCPUS_PER_VM=16                          # threads = vCPUs (user 2026-10-20); threads are derived, not configured
REGION=CXL_SWMC/config/cxl_region-ring2m.yaml   # 2 MiB Popcorn ring in every lifetime (user 2026-10-20)
EXPECT_DAX_UUID=3d40b5e0-dcaf-427f-bb9b-04fd6c8be26f   # devdax restore v3 (2026-10-28)
# Popcorn build 12 with the 2 MiB-ring bundle (cxl_shm module parameters from its tools/cxl_region.yaml = REGION)
POP_K=6.14.0-famfs-de-stijl+-ds-popcorn-new-12
POP_C=workspaces/popcorn-n/bundle-n-v2
POP_GT=/home/comsys/popcorn-12n
POP_BUNDLE_SHA=88692448ee780398254b5683f07af35769dc1156d778cd50def0b049a1505436
POP_BUILD=12
RECV_MODE=poll
MEG_LIB=builds/megalon/77

# ---- vector DB (run set "vdb": H1 + H2 vector DB, one op-mix run set) ----
VDB_POINTS="u5 u50 u90"                  # op mixes (experiments/h1/h1-plan.tsv rows: U=5 / 50 / 90)
VDB_MG_POINTS="u5 u50 u90"               # Megalon at every mix (H1 r1 had a result at every mix)
VDB_SYSTEMS="hw pop mg"                  # + mgoff (timers off) fixed lifetimes, as the H1 hook
VDB_SLO_PCT=99                           # fixed in the H1 hook (search:99:100); checked, not passed
VDB_SLO_MS=100
VDB_RAMP_START_MAP="u5:10 u50:10 u90:10" # H1 slo part --start 10 (m4-run.sh); recorded, not passed
VDB_H3_POINT=u50                         # H3 N = 2 point
VDB_H3_TOTAL_X=                          # [later] from run 1 (H3 experiment)
VDB_H2_LEVELS=1                          # user 2026-10-20 (M4 = b): + H2 level set per mix (L1 = lower confirmed max of hw, pop; L2 = L1/2), hw and pop fix-only lifetimes, skipped where equal to the H1 set
VDB_LATER_RUNS=cont                     # [later] runs >= 2: cont = H1 r2/r3 lifetimes (slo + fix at run-1 levels) | r1
VDB_DATASET=28m-x                        # pool B = 3.4M extended pool (user 2026-10-20), builds/vdb-inputs/3
VDB_X_DATA=builds/vdb-inputs/3/pubmed-a27m-b3400k-q10k
VDB_X_WRITES=builds/vdb-inputs/3/writes-a27m-b3400k-u3400k.bin
VDB_X_NB=3400000
VDB_X_MAXIDS=30470752
VDB_X_MAXW=6815744
VDB_X_MAXD=1835008
VDB_X_INIT_CAP=875000
VDB_MG_CAPACITY=h1                       # h1 = Megalon keeps --max-ids 28000000 (28m-x capacity does not fit its arena) | x
VDB_PLAIN_BUILD=builds/vdb/22            # libdestijl vdb-server (commit e40bc920a, De Stijl counter list)
VDB_VPLAIN=/home/comsys/vdb22ds          # guest install dir of builds/vdb/22 with the De Stijl region config (not yet installed)
VDB_MEG_BUILD=builds/vdb-megalon/14
VDB_VMEG=/home/comsys/vdbm14r2m
VDB_MEG_CFG=CXL_SWMC/systems/megalon/vectordb-2vm.yaml
VDB_LOADGEN_BUILD=builds/vdb-loadgen/9

# ---- RecSys (run sets "rs-main": hw, pop; "rs-h1": Megalon) ----
RS_POINTS="50 100 200 400"               # streaming update rates, trace samples/s (Q5: 300 not in run 1)
RS_MG_POINTS="50 200"                    # Megalon rates (Q2)
RS_SYSTEMS="hw pop"
RS_SLO_PCT=95                            # fixed in main-block.sh BLOCK=stream (query:95:100); checked, not passed
RS_SLO_MS=100
RS_RAMP_START=1                          # fixed in BLOCK=stream (--start 1); recorded
RS_H3_POINT=200
RS_FIX_LEVELS="L1 L2"                    # user 2026-10-20: L1 = lower confirmed max of hw, pop at the rate, L2 = L1 / 2
RS_FIX_FALLBACK_Q=1                      # 1 q/s window where hw or pop has no confirmed result at the rate
RS_MG_COMPARE_Q=1                        # extra 1 q/s window of hw, pop at the RS_MG_POINTS rates (Megalon comparison)
RS_FIX_SEP=1                             # 1 = fix windows in a fix-only lifetime per system after both SLO lifetimes (user)
RS_LATER_FIX_SEP=1                       # [later] runs >= LEVELS_FROM_RUN + 1 (levels from that run): 1 = as run 1 | 0 = in the SLO lifetime (cut)
RS_FIX_S=60                              # window length per level (s)
RS_FIX_SETTLE_S=60                       # discarded settle before the first window (s)
RS_MG_FIX_LEVELS="1"                     # Megalon (mg, mgoff) windows: 1 q/s (Megalon query T ~4.8 s, RECSYS-V1 v1.4)
RS_MG_PROBE_Q=1                          # [later] Megalon probe window (q/s), run 1 only (Q2)
RS_MG_SLO=auto                           # [later] auto: SLO(mg) only where the run-1 probe p95 <= RS_SLO_MS and the stream is valid | always | never
RS_LOW_RAMP_FACTOR=                      # [later] cut Q8 for runs 2-3 (factor 3 below 10 q/s): needs a loadgen option; empty = off
RS_PLAIN_BUILD=builds/recsys/14          # libdestijl recsys-server (commit e40bc920a)
RS_VM_PLAIN=/home/comsys/rs14ds          # guest install dir of builds/recsys/14 with the De Stijl region config (not yet installed)
RS_MEG_BUILD=builds/recsys-megalon/15        # 2026-10-20: /14 (77ba0fa69) predates --update-mode stream; /15 = live 2f94042dc on megalon/77
RS_VM_MEG=/home/comsys/rsm15r2m
RS_MEG_CFG=CXL_SWMC/systems/megalon/recsys-2vm.yaml
RS_MEGALON_BASE=builds/megalon/77
RS_LOADGEN=builds/recsys-loadgen/12/loadgen
RS_INPUTS=builds/recsys-inputs/1
RS_MG_RPO_OPT=--mg-rows-per-object
RS_MG_TABLE_N=0                          # one object per whole table (Q2; user confirmed 2026-10-20)
RS_MG_COH_SAMPLE=64                      # user 2026-10-20: time 1 in 64 Megalon sections, as the vector-DB backend (Megalon default); C_diff = T(mg) - T(mgoff) uses measured T, not the sampled C
RS_XT=7200

# ---- H3 (run sets "h3-vdb-n<N>", "h3-rs-n<N>": aggregate SLO search on N VMs; experiments/eval/RUN-H3.md) ----
# User design 2026-10-20 (rev after the first H3 draft): per N and system ONE aggregate SLO search; the offered TOTAL
# read-op rate is split evenly over the serving VMs (vector DB: every VM serves searches, loadgen draws the target
# uniformly; RecSys: node 0 = updater, queries round-robin over nodes 1..N-1); same SLO / ramp / confirm / overload
# rules as the 2-VM run sets; result = aggregate max under the SLO. Fault figure = per-step faults at the result
# (confirm steps, at_result). No constant-total-load windows. CDF = separate Popcorn lifetime at the N = H3_CDF_N
# max-under-SLO rate of the same run (its max_offered_x_pass; kprobe hist, guest root; run(s) H3_CDF_RUNS only):
# part settle (H3_CDF_S at that rate) -> h3 gate -> hist clear -> part cdf (H3_CDF_S) -> hist dump with the servers up.
# H3_* keys are measurement keys of the H3 run sets only: config_sha256 of h3-vdb = VDB_* + global + H3_*, of h3-rs =
# RS_* + global + H3_* (evalconf.py); the 2-VM run sets' config_sha256 does not include them.
H3_NODES="2 4 8"                         # N values of the figure; 32 vCPU / 192 GB split: N=2 16/96, N=4 8/48, N=8 4/24
H3_N2_SOURCE=2vm                         # N = 2 points = the 2-VM run sets of the same run k (vdb, rs-main): same sizing, threads, SLO rules
H3_TOTAL_VCPU=32
H3_TOTAL_RAM_GB=192
H3_SYSTEMS="hw ds"                       # De Stijl block (pop runs in the eval.conf block)
H3_DS_C=builds/destijl/1/deploy-v1       # De Stijl bundle (p-destijl-shm.sh, packet.sha256)
H3_DS_BUNDLE_SHA=f656925ab46baa4ce41978f35037fcd657bc023816a9e44bad6bb5ee51ef13ea
H3_DS_K=6.14.0-famfs-de-stijl+-ds-destijl-1
H3_DS_GT=/home/comsys/destijl-1-tools
H3_DS_T_US=0                             # staleness bound T (us): 0 = synchronous
H3_PINS=pins-vdb-ds-h3.sh                # = pins-vdb.sh with the vdb/22 hashes + De Stijl bundle and region (vector DB)
H3_VDB_POINT=u50                         # vector DB operating point (both Megalon and Popcorn degrade: pop 0.968, mg 0.308 at 2 VMs)
H3_RS_RATE=50                            # user 2026-10-20: RecSys streaming rate (samples/s); must be in RS_POINTS (N = 2 point)
H3_CDF_N=8                               # CDF pass at this N only
H3_CDF_RUNS="1"                          # CDF pass in these runs only (heavy monitoring, run 1 only: Q8)
H3_CDF_S=60                              # CDF window (s) after a settle of the same length at the same rate
H3_CDF_PFN_MOD=1                         # vector DB (user 2026-10-20, verifier M2): kprobe hist keeps pages with pfn % M == 0 (power of two; 1 = all pages)
H3_RS_CDF_PFN_MOD=16                     # RecSys (user 2026-10-20): ~856 k pages per serving VM would overflow the 2^17 map; sample 1/16
H3_RS_QUERY_SPREAD=rr                    # RecSys queries over nodes 1..N-1: rr = round robin (needs loadgen build recsys-loadgen/13, query_spread=rr)
H3_VDB_WRITES_DIR=builds/vdb-inputs/4    # writes files for N targets (writes-a27m-b3400k-u3400k-vms<N>.bin; same seed and ids as VDB_X_WRITES, targets over N VMs)
H3_RS_LOADGEN=builds/recsys-loadgen/13/loadgen   # RecSys loadgen with query_spread (pending build)
