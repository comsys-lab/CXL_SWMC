# eval run 2, vector DB N = 2, De Stijl (experiment de-stijl-evaluation-run2): the ds cells of eval-run2-vdb.conf with
# the SAME server build (builds/vdb/24) in its own guest install with the De Stijl region (vdb24ds), replica_mode off,
# T = main T 10 ms, 3 runs per cell (recovery/eval-run2-vdb-ds-<mix>-n2-r<k>-v<V>, --only ds:<mix>), the L1 step at the
# lowest max of mg / pop / hw of the same run and mix, and the pmax step at Popcorn's max of the same run and cell
# (H2N_PMAX_FROM = the pop cell's h2n-results.tsv; no pop row -> no step, NOTE).
# RUN2 RE-PIN before a real run (main session; recv-mode.sh refuses adaptive on a build < 9 bundle):
#   RECV_MODE=adaptive, H2N_DS_C / H2N_DS_BUNDLE_SHA / H2N_DS_K / H2N_DS_GT = the build-10 (or build-9 smoke) bundle,
#   H2N_DS_RECV_EXTRA="fault_poll=0" (fault-entry polling off, user 2026-11-03; build-9 bundles load it by default).
#   Until then the De Stijl keys are the run-1 build-7 placeholder pins (as eval3-b2.conf; chains re-pin per deploy).
#   Re-pinned 2026-11-03: RECV_MODE=adaptive, H2N_DS_RECV_EXTRA, vdb/24, Popcorn 13-recv2/deploy-v1 (the H2N_DS_* bundle
#   keys stay placeholders: the vdb N = 2 chain makes the build-10 bundle and writes a resolved copy of this conf).
