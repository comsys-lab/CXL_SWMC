# CONTINUOUS-CONFIRM VARIANT (main 2026-10-21 22:xx, user "run that way once on hw u50"): hw:u50, one lifetime, loadgen
# builds/vdb-loadgen/11; ramp/bisect steps keep the 3 s step warmup, each confirm = 15 s unmeasured warmup + ONE
# continuous 90 s measurement (--confirm-reps 1 --confirm-s 90 --confirm-warmup-s 15), judged on its p99 (pooled rule
# with one repeat = that window's p99), full length. Compare with confirm-test-wu (15 s warmup everywhere, 3 x 30 s).
# (text below inherited from confirm-test-wu.conf)
# WARMUP VARIANT (main 2026-10-21 20:4x): hw:u50 only, one lifetime.
# Confirm-rule test (exploratory, 2-VM scope of two-workload-evaluation-2vm): does the pooled confirm rule (p99 over the
# pooled samples of the confirm repeats) give the same SLO result as the majority rule (2 of 3 repeats pass)?
# Lifetimes hw:u50 and pop:u50 (Popcorn build 12, recv_mode=sleep), each 3 INDEPENDENT server lifetimes (H2N_REPEATS),
# SLO search only, the fp32 vector DB of two-workload run 1 (recovery/two-workload-eval-run1-vdb-v1: builds/vdb/17,
# 28m-x, ef 32, 15 search + 1 writer per VM, the H1 SLO part arguments = H2N_SLO_PART), on the current 2-VM topology
# (cxl_vm0/cxl_vm1, 16 vCPU / 96 GB: H2N_TOPO=2). Loadgen builds/vdb-loadgen/10 with --confirm-rule pooled
# --confirm-full (summary.json records the result of both rules; the majority result is recomputed from the probes).
# Driver: EVAL_CONF=<this file> runset-h2n.sh 2 1 (workspaces/confirm-test/test-chain-v1.sh).
# Copy of h2n.conf reduced to N = 2 without Megalon; differences: RUNS, DERIVED_ROOT, REGISTRY, RUNSETS,
# EVIDENCE_PREFIX, VCPUS_PER_VM, VDB_LOADGEN_BUILD, H2N_NODES, H2N_TOPO, H2N_RAM_GB, H2N_POINTS, H2N_SYSTEMS,
# H2N_CXLBW / H2N_HOSTCPU (0: run 1 had no samplers), + H2N_REPEATS, H2N_LOADGEN_EXTRA, H2N_PINS; Megalon keys dropped.
# Format, [run] / [later] marks and path rules as eval.conf (evalconf.py).

