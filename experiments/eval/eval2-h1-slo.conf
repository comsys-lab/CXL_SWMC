# eval2-h1-slo = new H1 runs 1-3 WITHOUT the fixed-load windows (workspaces/runs123/run-chain-v1.sh EVAL2_H1_FIXED=0;
# default is EVAL2_H1_FIXED=1 = eval2-h1.conf with runset-vdb.sh). SLO searches only, measurement rule of 2026-10-21
# 22:4x (state/PROJECT.md): 2 VMs x 16 vCPU / 96 GB (H2N_TOPO=2), fp32 vector DB of two-workload run 1
# (recovery/two-workload-eval-run1-vdb-v1: builds/vdb/17, 28m-x, ef 32, 15 search + 1 writer per VM; Megalon
# builds/megalon/77 + builds/vdb-megalon/14, h1 capacity --max-ids 28000000 --max-writes 2097152 --max-deletes
# 1048576 = m4-run.sh X_MEGALON_H1CAP), mixes u5 u10 u50 u90 u95, systems hw pop mg (Popcorn build 12, recv_mode sleep),
# one SLO lifetime per (system, mix); loadgen builds/vdb-loadgen/12 with the confirm rule and the past-the-knee steps
# (de-stijl-motivation-isca27 §3) appended to the H1 SLO part.
# Driver: EVAL_CONF=<this file> runset-h2n.sh 2 <k>. Evidence recovery/eval2-run<k>-h1-n2-v<V> (EVIDENCE_TAG h1).
# 'start rate already violates the SLO' = recorded result with empty max (h2n-block.sh 1f9b5e97f), export_h2n.py keeps
# the empty max. Seeds: SEED_BASE + k for every system / mix of run k (= eval2-h1.conf, eval2-h2.conf).
# Copy of confirm-test-c90.conf; differences: RUNS, DERIVED_ROOT, REGISTRY, EVIDENCE_PREFIX, + EVIDENCE_TAG,
# VDB_POINTS / VDB_MG_POINTS / VDB_SYSTEMS / VDB_RAMP_START_MAP, H2N_POINTS, H2N_SYSTEMS (hw pop mg), H2N_REPEATS 1,
# + H2N_MG_*_N2 (the run-1 Megalon inputs). Format, [run] / [later] marks and path rules as eval.conf (evalconf.py).

# ---- global ----
RUNS=3                                   # [run] runs 1-3
LEVELS_FROM_RUN=1                        # unused by h2n (no fixed-load levels); required by evalconf.py
RESULTS_ROOT=recovery                    # [run] raw evidence (immutable)
DERIVED_ROOT=workspaces/eval2-derived/h1-slo   # [run] canonical CSVs: <root>/vdb/h2n-n2/run<k>/
REGISTRY=workspaces/eval2-derived/h1-slo-runs.tsv   # [run] own runs.tsv
RUNSETS="h2n-n2"                         # [run] run sets this config may drive (lib.sh)
EVIDENCE_PREFIX=eval2                    # [run] <RESULTS_ROOT>/eval2-run<k>-h1-n2-v<V>
EVIDENCE_TAG=h1                          # [run] runset-h2n.sh: tag h1-n2
SEED_BASE=20261020                       # loadgen seed = SEED_BASE + k in every lifetime of run k
VCPUS_PER_VM=16                          # current 2-VM topology; threads = vCPUs: 15 search + 1 writer (as run 1)
REGION=CXL_SWMC/config/cxl_region-ring2m.yaml
EXPECT_DAX_UUID=3d40b5e0-dcaf-427f-bb9b-04fd6c8be26f   # devdax restore v3 (2026-10-28); runs before that: f61e87a2-aaa7-41a7-94d9-5e74fe078049
POP_K=6.14.0-famfs-de-stijl+-ds-popcorn-new-12
POP_C=workspaces/popcorn-n/bundle-n-v2
POP_GT=/home/comsys/popcorn-12n
POP_BUNDLE_SHA=88692448ee780398254b5683f07af35769dc1156d778cd50def0b049a1505436
POP_BUILD=12
RECV_MODE=sleep                          # user 2026-10-20 22:3x: Popcorn recv_mode=sleep for all future runs
MEG_LIB=builds/megalon/77                # pins-vdb-confirm11.sh keeps the N = 2 pins

# ---- vector DB (two-workload run 1 values) ----
VDB_POINTS="u10 u50 u90"                 # user 2026-10-22 (u5, u95 dropped)
VDB_MG_POINTS="u10 u50 u90"
VDB_SYSTEMS="hw pop mg"
VDB_SLO_PCT=99
VDB_SLO_MS=100
VDB_RAMP_START_MAP="u10:10 u50:10 u90:10"
VDB_DATASET=28m-x
VDB_X_DATA=builds/vdb-inputs/3/pubmed-a27m-b3400k-q10k
VDB_X_WRITES=builds/vdb-inputs/3/writes-a27m-b3400k-u3400k.bin
VDB_X_NB=3400000
VDB_X_MAXIDS=30470752
VDB_X_MAXW=6815744
VDB_X_MAXD=1835008
VDB_X_INIT_CAP=875000
VDB_MG_CAPACITY=h1                       # h2n-block: Megalon --max-ids 28000000 --max-writes 2097152
VDB_PLAIN_BUILD=builds/vdb/17
VDB_VPLAIN=/home/comsys/vdb17r2m
VDB_MEG_BUILD=builds/vdb-megalon/14      # pinned by pins-vdb-confirm11.sh (= H2N_MG_BUILD_N2)
VDB_VMEG=/home/comsys/vdbm14r2m
VDB_MEG_CFG=CXL_SWMC/systems/megalon/vectordb-2vm.yaml
VDB_LOADGEN_BUILD=builds/vdb-loadgen/12  # runs123 d8872c050: loadgen/11 + past-the-knee options (pins-vdb-confirm12.sh)

# ---- h2n (runset-h2n.sh / h2n-block.sh) ----
H2N_NODES="2"
H2N_TOPO=2                               # 2-VM topology: cxl_vm0/cxl_vm1, 16 vCPU / 96 GB
H2N_RAM_GB=96
H2N_POINTS="u10 u50 u90"                 # user 2026-10-22
H2N_SYSTEMS="hw pop mg"                  # order as two-workload run 1 per mix: hw, pop, mg (systems outer here)
H2N_SLO_PART="--mode slo --start 10 --factor 1.5 --precision 0.02 --confirm-precision 0.01 --max-confirm-probes 6 --confirm-step-down 0.05 --max-steps 25 --warmup-s 10 --step-warmup-s 3 --step-measure-s 15 --confirm-s 30 --confirm-reps 3"
H2N_LOADGEN_EXTRA="--confirm-rule pooled --confirm-full --confirm-reps 1 --confirm-s 90 --confirm-warmup-s 15 --overload-base result --overload 1.1,1.25,1.5,2.0 --start-fail-steps 1.5,2.25"
H2N_WRITES_N2=builds/vdb-inputs/3/writes-a27m-b3400k-u3400k.bin
H2N_MAXD_N2=1835008
H2N_MG_LIB_N2=builds/megalon/77
H2N_MG_BUILD_N2=builds/vdb-megalon/14
H2N_VMEG_N2=/home/comsys/vdbm14r2m
H2N_MG_CFG_N2=CXL_SWMC/systems/megalon/vectordb-2vm.yaml
H2N_MG_MAXD_N2=1048576                   # m4-run.sh X_MEGALON_H1CAP
H2N_OPCOH_STRICT=0
H2N_CXLBW=0                              # as two-workload run 1 (no samplers on the 2-VM runs)
H2N_HOSTCPU=0
H2N_PINS=pins-vdb-confirm12.sh
