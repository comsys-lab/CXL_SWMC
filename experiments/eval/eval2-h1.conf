# eval2-h1 = new H1, runs 1-3 under the measurement rule of 2026-10-21 22:4x (state/PROJECT.md): the whole new H1 set
# (2 VMs x 16 vCPU / 96 GB, fp32 vector DB of two-workload run 1, mixes u5 u10 u50 u90 u95, systems hw pop mg + mgoff)
# WITH the fixed-load windows of two-workload run 1 (main correction 2026-10-21: H1 keeps L1/L2 per mix from the run's
# own SLO results, mgoff for C_diff, the H2 level set; runset-vdb.sh r1 mode, as recovery/two-workload-eval-run1-vdb-v1
# and recovery/two-workload-eval-run1-vdb-u10u95-v1). Driver: EVAL_CONF=<this file> runset-vdb.sh <k>
# (workspaces/runs123/run-chain-v1.sh, EVAL2_H1_FIXED=1). The SLO-only variant (EVAL2_H1_FIXED=0) is eval2-h1-slo.conf.
# A copy of h1-u10u95.conf (vdb and global keys; RecSys / H3 keys dropped: not read by runset-vdb.sh, not in
# config_sha256(vdb)) that changes:
#   RUNS 3, DERIVED_ROOT / REGISTRY (workspaces/eval2-derived/), EVIDENCE_PREFIX eval2 + EVIDENCE_TAG h1-n2
#   (evidence recovery/eval2-run<k>-h1-n2-v<V>), VDB_POINTS / VDB_MG_POINTS / VDB_RAMP_START_MAP u5 u10 u50 u90 u95,
#   VDB_LOADGEN_BUILD builds/vdb-loadgen/12, + VDB_PINS pins-vdb-confirm12.sh (loadgen/12 hashes),
#   + VDB_SLO_EXTRA (confirm = 15 s unmeasured warmup + ONE continuous 90 s window, pooled rule = that window's p99,
#   full length; past-the-knee steps (§3 of reports/experiments/de-stijl-motivation-isca27.md); appended to every SLO
#   part, loadgen keeps the last value; ramp/bisect and fixed windows unchanged),
#   VDB_LATER_RUNS r1 (every run k is a full r1 round: own SLO results -> own levels, same lifetime order and
#   structure in runs 1-3; [later] key, not in config_sha256).
# Seeds: loadgen seed of run k = SEED_BASE + k for every system and mix of the run (runset-vdb.sh SEEDB + hook n = 1;
# fix parts SEED + 1), = eval2-h2.conf / eval2-h1-slo.conf.
# Format, [run] / [later] marks and path rules as eval.conf (evalconf.py).

# ---- global ----
RUNS=3                                   # [run] runs 1-3 (user 2026-10-21 22:4x)
RUNSETS=vdb                              # [run] run sets this config may drive (lib.sh)
LEVELS_FROM_RUN=1                        # unused with VDB_LATER_RUNS=r1 (every run computes its own levels)
RESULTS_ROOT=recovery                    # [run] raw evidence (immutable)
DERIVED_ROOT=workspaces/eval2-derived/h1 # [run] canonical CSVs (regenerable): <root>/vdb/vdb/run<k>/
REGISTRY=workspaces/eval2-derived/h1-runs.tsv   # [run] own runs.tsv (registry.py EVAL_REGISTRY)
EVIDENCE_PREFIX=eval2                    # [run] <RESULTS_ROOT>/eval2-run<k>-h1-n2-v<V>
EVIDENCE_TAG=h1-n2                       # [run] tag instead of the run set name vdb
SEED_BASE=20261020                       # loadgen seed of run k = SEED_BASE + k (vector DB: H1 hook H1_SEED_BASE)
VCPUS_PER_VM=16                          # threads = vCPUs (user 2026-10-20): 15 search + 1 writer per VM
REGION=CXL_SWMC/config/cxl_region-ring2m.yaml   # 2 MiB Popcorn ring in every lifetime (user 2026-10-20)
EXPECT_DAX_UUID=f61e87a2-aaa7-41a7-94d9-5e74fe078049
POP_K=6.14.0-famfs-de-stijl+-ds-popcorn-new-12
POP_C=workspaces/popcorn-n/bundle-n-v2
POP_GT=/home/comsys/popcorn-12n
POP_BUNDLE_SHA=88692448ee780398254b5683f07af35769dc1156d778cd50def0b049a1505436
POP_BUILD=12
RECV_MODE=sleep                          # user 2026-10-20 22:3x: Popcorn recv_mode=sleep for all runs
MEG_LIB=builds/megalon/77

# ---- vector DB (run set "vdb": two-workload run 1 values) ----
VDB_POINTS="u5 u10 u50 u90 u95"          # new H1 mixes (experiments/h1/h1-plan.tsv vdb rows)
VDB_MG_POINTS="u5 u10 u50 u90 u95"       # Megalon at every mix (as run 1)
VDB_SYSTEMS="hw pop mg"                  # + mgoff (timers off) fixed lifetimes, as the H1 hook
VDB_SLO_PCT=99                           # fixed in the H1 hook (search:99:100); checked, not passed
VDB_SLO_MS=100
VDB_RAMP_START_MAP="u5:10 u10:10 u50:10 u90:10 u95:10"   # H1 slo part --start 10 (m4-run.sh); recorded, not passed
VDB_H3_POINT=u50                         # unused (kept: eval.conf key set)
VDB_H3_TOTAL_X=                          # [later] unused
VDB_H2_LEVELS=1                          # user 2026-10-20 (M4 = b): + H2 level set per mix (hw and pop fix-only lifetimes)
VDB_LATER_RUNS=r1                        # [later] r1 = every run k a full r1 round (same structure as run 1) | cont
VDB_DATASET=28m-x                        # pool B = 3.4M extended pool (user 2026-10-20), builds/vdb-inputs/3
VDB_X_DATA=builds/vdb-inputs/3/pubmed-a27m-b3400k-q10k
VDB_X_WRITES=builds/vdb-inputs/3/writes-a27m-b3400k-u3400k.bin
VDB_X_NB=3400000
VDB_X_MAXIDS=30470752
VDB_X_MAXW=6815744
VDB_X_MAXD=1835008
VDB_X_INIT_CAP=875000
VDB_MG_CAPACITY=h1                       # h1 = Megalon keeps --max-ids 28000000 (28m-x capacity does not fit its arena)
VDB_PLAIN_BUILD=builds/vdb/17
VDB_VPLAIN=/home/comsys/vdb17r2m         # guest install dir (region = REGION)
VDB_MEG_BUILD=builds/vdb-megalon/14
VDB_VMEG=/home/comsys/vdbm14r2m
VDB_MEG_CFG=CXL_SWMC/systems/megalon/vectordb-2vm.yaml
VDB_LOADGEN_BUILD=builds/vdb-loadgen/12  # branch runs123 d8872c050 = loadgen/11 + --overload-base, --start-fail-steps
VDB_PINS=pins-vdb-confirm12.sh           # = pins-vdb.sh with the loadgen/12 hashes
# confirm rule 2026-10-21 22:4x + past-the-knee rule (de-stijl-motivation-isca27 §3: overload at the confirmed offered
# rate x 1.1, 1.25, 1.5, 2.0; start rate failed: two more steps at start x 1.5, x 2.25)
VDB_SLO_EXTRA="--confirm-rule pooled --confirm-full --confirm-reps 1 --confirm-s 90 --confirm-warmup-s 15 --overload-base result --overload 1.1,1.25,1.5,2.0 --start-fail-steps 1.5,2.25"
