# eval run 2, vector DB N = 2, Megalon / Popcorn / All HWcc (experiment de-stijl-evaluation-run2; doc
# reports/experiments/de-stijl-evaluation-run2.md; state/PROJECT.md "Evaluation run 2"). Same cell procedure as eval3
# block B1 (eval3-b1.conf: 54M SQ8 ef 32, 2 hosts x 4 vCPU, u10 / u50 / u90, one SLO search per lifetime, L1 step) with
# the run-2 changes: ONE vector DB build for hw / pop / ds = builds/vdb/23 (slot-zero + stale-header guard), Megalon
# builds/vdb-megalon/17-n<N>, NEW guest install dirs (vdb23r2m, vdbm17r2m-n<N>: install step for the main session),
# 3 runs per cell (k = 1..3, one evidence dir per cell and run: recovery/eval-run2-vdb-<sys>-<mix>-n2-r<k>-v<V>, --only
# <sys>:<mix> per call), L1 from run 2's own mg cell of the same run, and the pmax step (fault breakdown at Popcorn's
# max of the cell, H2N_PMAX; pop lifetimes take it from their own slo part).
# RUN2 RE-PIN before a real run (main session; recv-mode.sh refuses adaptive before the artifacts exist):
#   RECV_MODE=adaptive, POP_ADAPT_KO=<signed builds/popcorn_new/13-recv<k> cxl_shm.ko>, POP_C / POP_BUNDLE_SHA / POP_GT
#   of the Popcorn bundle that installs it. Until then the receiver keys are the run-1 values (sleep, deploy-v2).
# Format: KEY=value per line (evalconf.py). [run] keys are bookkeeping.
