# popcorn-directory-reference (2026-11-07; doc reports/experiments/popcorn-directory-reference.md): system "pop-dir" =
# Popcorn build 14 (kernel builds/popcorn_new/14 + cxl_shm 14.0-dir, directory=flat, region
# config/cxl_region-popcorn-dir.yaml, guest install vdb24popdir on cxl_vm0 = base of every VM8 overlay), vector DB u50,
# N = 4 / 8 (VM8 topology), one run (--only pop:u50). = eval-run2-vdb-n48.conf key by key except DERIVED_ROOT REGISTRY
# EVIDENCE_PREFIX H2N_EVIDENCE_NAME REGION POP_K POP_C POP_GT POP_BUNDLE_SHA POP_BUILD POP_ADAPT_KO VDB_VPLAIN H2N_POP_DIR
# (asserted by workspaces/popcorn-directory-chain-v1.sh). POP_C / POP_BUNDLE_SHA / POP_GT are resolved by the chain.
# Source conf header (eval-run2-vdb-n48.conf):
# eval run 2, vector DB N = 4 / 8 (VM8 topology), All HWcc / Popcorn (experiment de-stijl-evaluation-run2; doc
# reports/experiments/de-stijl-evaluation-run2.md §3 step (d) "VM8: vdb u50 ... for ds/pop/hw"). Same cell procedure as
# run-1 block E (eval3-e-vdb.conf: u50, 54M SQ8 ef 32, cxl_vm0..N-1 at 4 vCPU / 24 GB, CXL.mem sampler + Host CPU) with
# the run-2 changes of eval-run2-vdb.conf: ONE vector DB build for hw / pop / ds = builds/vdb/23 (or 24 once built:
# cxl_ipoll kthread prefix; re-pin VDB_PLAIN_BUILD + pins-vdb-run2.sh), NEW guest install dir vdb23r2m (on cxl_vm0..7:
# install step for the main session), 3 runs per cell (recovery/eval-run2-vdb-<sys>-u50-n<N>-r<k>-v<V>, --only
# <sys>:u50), and the pmax step (H2N_PMAX; pop from its own slo part). No Megalon at N > 2 (run 1 block E had no mg
# cell: recovery/eval3-e-{hw,pop,ds}-* only), so no L1 step (L1 is a Megalon load). ds: eval-run2-vdb-ds-n48.conf.
# RUN2 RE-PIN DONE 2026-11-03 (branch run2-harness2, V8 chain): RECV_MODE=adaptive, POP_ADAPT_KO (13.2-adaptive),
#   POP_C / POP_BUNDLE_SHA = builds/popcorn_new/13-recv2/deploy-v1, POP_GT=/home/comsys/popcorn-13r2, vdb/24. Guest dir
#   = the run-2 N = 2 install vdb24r2m (same build, same ring2m region file; installed on cxl_vm0, whose disk is the base
#   of every VM8 overlay: run-1 block E did the same with vdb18r2m). The V8 chain checks vm0 has it before the freeze.
# Format: KEY=value per line (evalconf.py). [run] keys are bookkeeping.
RUNS=3                                   # [run] 3 runs per cell (user 2026-11-03 Q3)
LEVELS_FROM_RUN=1                        # unused by h2n; required by evalconf.py
RESULTS_ROOT=recovery                    # [run]
DERIVED_ROOT=workspaces/popcorn-directory/derived   # [run]
REGISTRY=workspaces/popcorn-directory/derived/runs-vdb-n48.tsv   # [run]
RUNSETS="h2n-n4 h2n-n8"                  # [run]
EVIDENCE_PREFIX=popcorn-directory        # [run] unused with H2N_EVIDENCE_NAME
EVIDENCE_TAG=vdb-n48                     # [run]
H2N_EVIDENCE_NAME=popcorn-directory-{SYS}dir-{MIX}-n{N}-r{RUN}   # [run] approved scope recovery/popcorn-directory-popdir-u50-n<N>-r1-vV
SEED_BASE=20261020
VCPUS_PER_VM=4                           # VM8 XMLs: 4 vCPU / 24 GB per VM (3 search + 1 writer)
