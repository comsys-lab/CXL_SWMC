# RecSys workload v7 (reports/experiments/de-stijl-evaluation-isca27.md §R; workloads/recsys/DESIGN.md §10): trained
# MLPerf DLRMv2 checkpoint (fp16 records, 320 B, full tables), node 0 trains online (row-wise Adagrad, test-then-train),
# AUC / logloss / stale-read fraction / staleness age / updater CPU per ramp step (steps.csv) and auc_run.csv per lifetime.
# = eval3-rs-c400.conf (same threads, SLO query p95 <= 400 ms at 4 vCPU, ramp from 1 q/s, rates 50 / 200 / 400,
# Popcorn 13, De Stijl 7) + the RS_V7_* keys below, own prefix / registry / derived root.
# STATUS: DRAFT, not approved for a VM run. Open before a real run:
#  - v7 methodology values decided by the user 2026-11-03 ("권장안대로 다 해", state/PROJECT.md "Evaluation run 2"):
#    lr 4e-4, initial Adagrad state 0, 8 samples per training step, query window W 60 s (no @USER@ left).
#  - Receiver (run 2: adaptive for De Stijl and Popcorn): RECV_MODE=adaptive + POP_ADAPT_KO=<signed 13-recv<k> module>
#    and RS_DS_C / RS_DS_BUNDLE_SHA / RS_DS_K / RS_DS_GT of a build >= 9 bundle, once those bundles exist (main session;
#    recv-mode.sh refuses adaptive before). Until then the conf keeps RECV_MODE=sleep and the build-7 ds bundle.
#  - Guest image copy: workspaces/run2-harness/rs-v7-image-copy.sh (dry check / VM copy step for the main session).
#  - RS_PLAIN_BUILD / RS_MEG_BUILD / RS_LOADGEN are pinned to the v7 builds (recsys/16, recsys-megalon/16,
#    recsys-loadgen/14; 2026-11-03); RS_VM_PLAIN / RS_VM_MEG / RS_DS_VM_PLAIN still name the v6 guest installs ->
#    re-pin to the v7 guest installs (main session).
#  - RS_V7_IMAGE: guest copy of the 61 GiB image on node 0 (VM step for the main session; see STATUS.md "image reload").
# Format: KEY=value or KEY="v1 v2" per line, no shell expansion (evalconf.py). Paths without a leading / are relative
# to P=/home/comsys/sungsu/destijl-control. [run] keys are bookkeeping (not in config_sha256).

