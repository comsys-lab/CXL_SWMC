# h2n-ds = TEMPLATE for De Stijl v2 on the H2 vector DB harness (runset-h2n.sh): N = 2, mix u10, lifetimes hw:u10
# ds:u10 (hw runs on the De Stijl guest kernel without cxl_shm: the block's control), same measurement keys as
# eval2-h2.conf (SQ8, ef 64, loadgen builds/vdb-loadgen/12 + H2N_LOADGEN_EXTRA, SLO search p99 <= 100 ms).
# NOT AN APPROVED EXPERIMENT: no state/EXPERIMENTS.md block covers ds measurement runs yet (destijl-v2-bringup is the
# bring-up only). Before a run: an experiment block with this conf's evidence root, the guest install of
# builds/vdb/22 at VDB_VPLAIN (main session), the De Stijl guest kernel H2N_DS_K on the N VMs.
# Differences from eval2-h2.conf: DERIVED_ROOT, REGISTRY, RUNSETS, EVIDENCE_PREFIX / EVIDENCE_TAG (evidence
# recovery/destijl-v2-run<k>-h2n-ds-n2-v<V>), VDB_PLAIN_BUILD / VDB_VPLAIN (vdb/22: libdestijl), VDB_SYSTEMS,
# H2N_NODES / POINTS / SYSTEMS, H2N_DS_* keys, H2N_PINS pins-vdb-ds.sh, no H2N_MG_* keys (no mg lifetime).
# Re-pin to De Stijl build 4: H2N_DS_C / H2N_DS_BUNDLE_SHA / H2N_DS_K / H2N_DS_GT here + the bundle line of pins-vdb-ds.sh.
# Use: EVAL_CONF=<this file> runset-h2n.sh 2 <k> [--dry].

# ---- global ----
RUNS=3                                   # [run] runs per N
LEVELS_FROM_RUN=1                        # unused by h2n (no fixed-load levels); required by evalconf.py
RESULTS_ROOT=recovery                    # [run] raw evidence (immutable)
DERIVED_ROOT=workspaces/destijl-v2-derived/h2n-ds   # [run] canonical CSVs (export_h2n.py)
REGISTRY=workspaces/destijl-v2-derived/h2n-ds-runs.tsv   # [run] this template's runs.tsv (registry.py EVAL_REGISTRY)
RUNSETS="h2n-n2"                         # [run] N = 2 only
EVIDENCE_PREFIX=destijl-v2               # [run] <RESULTS_ROOT>/destijl-v2-run<k>-h2n-ds-n<N>-v<V>
EVIDENCE_TAG=h2n-ds                      # [run] runset-h2n.sh: tag h2n-ds-n<N>
SEED_BASE=20261020                       # loadgen seed of run k = SEED_BASE + k (as eval2-h2)
VCPUS_PER_VM=4                           # VM8 topology: 4 vCPU per VM; threads = vCPUs: 3 search + 1 writer
REGION=CXL_SWMC/config/cxl_region-ring2m.yaml   # Popcorn region (pinned; a ds block uses the De Stijl region instead)
EXPECT_DAX_UUID=45fd85d6-724d-4eee-8aad-d5152add019d   # devdax restore v4 (2026-11-01)
POP_K=6.14.0-famfs-de-stijl+-ds-popcorn-new-12   # unused by a ds block (runset-h2n.sh checks the bundle)
POP_C=workspaces/popcorn-n/bundle-n-v2
POP_GT=/home/comsys/popcorn-12n
POP_BUNDLE_SHA=88692448ee780398254b5683f07af35769dc1156d778cd50def0b049a1505436
POP_BUILD=12
RECV_MODE=sleep                          # as eval2-h2 (user 2026-10-20: recv_mode=sleep); De Stijl accepts poll | sleep
MEG_LIB=builds/megalon/77                # unused (no mg lifetime); kept for evalconf parity with eval2-h2

# ---- vector DB (eval2-h2 values) ----
VDB_POINTS="u10 u50 u90"
VDB_MG_POINTS="u10 u50 u90"
VDB_SYSTEMS="hw ds"
VDB_SLO_PCT=99
VDB_SLO_MS=100
VDB_RAMP_START_MAP="u10:10 u50:10 u90:10"
VDB_DATASET=28m-x
VDB_X_DATA=builds/vdb-inputs/3/pubmed-a27m-b3400k-q10k
VDB_X_WRITES=builds/vdb-inputs/3/writes-a27m-b3400k-u3400k.bin
VDB_X_NB=3400000
VDB_X_MAXIDS=30470752
VDB_X_MAXW=6815744
VDB_X_MAXD=1835008
VDB_X_INIT_CAP=875000
VDB_MG_CAPACITY=h1
VDB_PLAIN_BUILD=builds/vdb/22            # libdestijl vdb-server (commit e40bc920a; fp32 + sq8, De Stijl counter list)
VDB_VPLAIN=/home/comsys/vdb22ds          # guest install dir of builds/vdb/22 with the De Stijl region config (h2n-block.sh
                                         # compares cfg/cxl_region.yaml with H2N_DS_GT's; main session installs, not yet)
VDB_MEG_BUILD=builds/vdb-megalon/14      # UNUSED (evalconf parity)
VDB_VMEG=/home/comsys/vdbm14r2m          # UNUSED
VDB_MEG_CFG=CXL_SWMC/systems/megalon/vectordb-2vm.yaml
VDB_LOADGEN_BUILD=builds/vdb-loadgen/12

# ---- h2n ----
H2N_NODES="2"
H2N_TOPO=8                               # VM8 topology (cxl_vm0..N-1, 4 vCPU / 24 GB), as eval2-h2
H2N_RAM_GB=24
H2N_POINTS="u10"
H2N_SYSTEMS="hw ds"                      # lifetimes hw:u10 ds:u10
H2N_DS_C=builds/destijl/1/deploy-v1      # De Stijl bundle (p-destijl-shm.sh, packet.sha256)
H2N_DS_BUNDLE_SHA=f656925ab46baa4ce41978f35037fcd657bc023816a9e44bad6bb5ee51ef13ea
H2N_DS_K=6.14.0-famfs-de-stijl+-ds-destijl-1
H2N_DS_GT=/home/comsys/destijl-1-tools
H2N_DS_T_US=0                            # staleness bound T (us): 0 = synchronous
H2N_SLO_PART="--mode slo --start 10 --factor 1.5 --precision 0.02 --confirm-precision 0.01 --max-confirm-probes 6 --confirm-step-down 0.05 --max-steps 25 --warmup-s 10 --step-warmup-s 3 --step-measure-s 15 --confirm-s 30 --confirm-reps 3"
H2N_WRITES_N2=builds/vdb-inputs/3/writes-a27m-b3400k-u3400k.bin
H2N_MAXD_N2=1835008
H2N_OPCOH_STRICT=0                       # 1 = opcoh_check FAIL stops the block; 0 = NOTE (recv_check FAIL always stops)
H2N_CXLBW=1
H2N_HOSTCPU=1
H2N_VEC_FORMAT=sq8
H2N_EF=32 # query ef 32 (user 2026-11-01: vector DB = 54M SQ8 at ef 32 for every experiment from now on; recall@10 0.965 on the 54M index, bytes/query 20.8 MB = 0.61 x ef 64; was 64 since 2026-10-30, 24 before)
H2N_INIT=/home/comsys/vdb/init/seg32c32m-a27m-sq8
H2N_HOST_IMAGE=builds/vdb-index-sq8/1/seg32-c32m-a27m-m16-efc128-sq8
H2N_PINS=pins-vdb-ds.sh                  # = pins-vdb-sq8-lg12.sh with the vdb/22 hashes + De Stijl bundle and region
H2N_LOADGEN_EXTRA="--confirm-rule pooled --confirm-full --confirm-reps 1 --confirm-s 90 --confirm-warmup-s 15 --overload-base result --overload 1.1,1.25,1.5,2.0 --start-fail-steps 1.5,2.25"
