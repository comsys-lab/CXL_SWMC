# eval run 2 receiver ablation, Popcorn (experiment de-stijl-evaluation-run2; state/HANDOFF.md 결정 대기 -1; chain
# workspaces/de-stijl-evaluation-run2-recv-ablation-chain-v1.sh). = eval-run2-vdb.conf (same builds, bundle, guest
# dirs, dataset, 2 x 4 vCPU, adaptive receiver at load + REQUIRE_ADAPTIVE readback at the lifetime start) except: one
# pop:u50 lifetime of fixed parts at 136 search/s (3 x 30 s) + one 150 search/s step per receiver variant, the variant
# parameters written per part by fixed-part-hook.sh (H2N_FIXED_RECVP, explicit expected values per part) and restored
# to H2N_FIXED_RECVP_BASE (= the adaptive defaults the lifetime start checks) after each part. No L1, no pmax.
# Format: KEY=value per line (evalconf.py). [run] keys are bookkeeping.
