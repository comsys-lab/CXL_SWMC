# eval3 block A (experiment de-stijl-evaluation-run1; schedule doc §2 "§5 Accuracy", user: accuracy mix u90, T in ms):
# vector DB 54M SQ8, query ef 32, 2 hosts x 4 vCPU (guest CPUs 4-15 offline), De Stijl build 7 (bundle deploy-v6),
# replicate-all (H2N_DS_REPLICA_MODE=all, replica pool 64 GiB >= the ~53 GB index), mix u90, staleness bound
# T = 0 / 1 / 100 / 10000 ms = H2N_DS_T_US 0 / 1000 / 100000 / 10000000 (H2N_DS_T_SWEEP: lifetimes ds:u90:t<T us>),
# plus one hw lifetime as the no-staleness recall reference, run on the De Stijl kernel (H2N_DS_KERNEL=1: no cxl_shm,
# De Stijl region and vdb/22, as hw lifetimes of the earlier ds blocks) so the block needs no kernel switch.
# Accuracy export on (searches.bin + e1.sample.bin + w range per lifetime); recall@10 offline on the Host afterwards.
# Roles: as every h2n block, BOTH VMs serve searches (loadgen draws each search's target uniformly) and BOTH run one
# writer (the writes file targets both VMs); the doc's "node 0 updates / node 1 searches" is NOT what h2n does
# (reported to the main session; a split-role run needs a target-0 writes file and per-stream targets in loadgen).
# One evidence dir per cell: recovery/eval3-a-<cell>-n2-v<V>, cell = ds-u90-t<T> | hw-u90 (--only per call).
RUNS=1                                   # [run]
LEVELS_FROM_RUN=1                        # unused by h2n; required by evalconf.py
RESULTS_ROOT=recovery                    # [run]
