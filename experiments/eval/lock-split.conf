# lock-split = exploratory experiment popcorn-writer-lock-split (reports/experiments/popcorn-writer-lock-split.md,
# approved 2026-10-23): H2 N = 8 u90, Popcorn build 12 only, one lifetime of fixed windows (15 s warmup + 90 s):
# offered 577 / 939 / 985 ops/s with instr/detail = 1, then 10 ops/s with recv_mode=sleep and with recv_mode=poll
# (the always-spinning receiver; "spin" in the design) at detail 0; server builds/vdb/21 (vdb/18 + VDB_LOCK_SPLIT
# counters, DESIGN.md §19) with VDB_LOCK_SPLIT=1. Evidence recovery/popcorn-writer-lock-split-v<V>.
# Driver: workspaces/popcorn-writer-lock-split-chain-v1.sh (part "lock").
# Differences from eval2-h2.conf: DERIVED_ROOT, REGISTRY, RUNSETS, EVIDENCE_*, VDB_PLAIN_BUILD / VDB_VPLAIN (vdb/21),
# H2N_PINS (vdb/21 hashes), H2N_NODES/POINTS/SYSTEMS, H2N_CXLBW=0 (design: CXL sampler not needed), H2N_FIXED,
# H2N_NODE_ENV_EXTRA, H2N_ALLOW_DETAIL; H2N_LOADGEN_EXTRA dropped.
# ---- text of eval2-h2.conf below ----
# eval2-h2 = new H2 runs 1-3 under the measurement rule of 2026-10-21 22:4x (state/PROJECT.md): SQ8, ef 24, N = 2/4/8
# x u10 u50 u90 x hw mg pop (user 2026-10-22), SLO searches only; loadgen builds/vdb-loadgen/12 with H2N_LOADGEN_EXTRA (confirm = 15 s
# unmeasured warmup + ONE continuous 90 s window, pooled rule = that window's p99, full length; past-the-knee steps of
# de-stijl-motivation-isca27 §3). Copy of h2n-sq8.conf;
# differences: DERIVED_ROOT, REGISTRY, EVIDENCE_PREFIX eval2 + EVIDENCE_TAG h2 (evidence recovery/eval2-run<k>-h2-n<N>-
# v<V>), VDB_LOADGEN_BUILD 12, H2N_PINS pins-vdb-sq8-lg12.sh, + H2N_LOADGEN_EXTRA. Seeds: SEED_BASE + k for every N,
# system and mix of run k (= eval2-h1.conf). Driver: workspaces/runs123/h2n-chain-v4.sh (via run-chain-v1.sh).
# ---- text of h2n-sq8.conf below ----
# SQ8 variant of h2n.conf (user decision 2026-10-21 00:2x, state/PROJECT.md: vectors stored as SQ8, same HNSW
# parameters, recall@10 vs the fp32 exact GT reported; recall target >= 0.95 via the query ef, user 00:4x).
# Differences from h2n.conf: EVIDENCE_PREFIX / DERIVED_ROOT / REGISTRY (own runs), VDB_PLAIN_BUILD / VDB_VPLAIN and
# H2N_MG_BUILD_N* / H2N_VMEG_N* (builds of branch vdb-sq8), H2N_VEC_FORMAT, H2N_EF, H2N_INIT, H2N_HOST_IMAGE, H2N_PINS.
# Pilot (main session): runset-h2n.sh 2 1 --only hw:u5, then runset-h2n.sh 4 1 --only hw:u5 (EVAL_CONF=this file).
# ---- text of h2n.conf below ----
# New H2 = vector DB VM-count scaling (user decisions 2026-10-20 22:3x, state/PROJECT.md last entry; RUN-H2N.md).
# N = 2, 4, 8 VMs, EVERY VM 4 vCPU / 24 GB (the VM8 topology, VMN_TOPO=8, starting cxl_vm0..N-1); mixes u5 u50 u90 at
# every N; systems hw (all-HWcc), mg (Megalon, per-N builds with LOGICAL_NODE_NUM = N), pop (Popcorn build 12 N-node
# bundle, recv_mode=sleep). Per N, mix and system ONE aggregate SLO search (search p99 <= 100 ms, the H1 SLO part
# arguments); the offered total rate is split evenly over the N VMs (loadgen draws each search's target uniformly);
# one writer per VM + 3 search threads (threads = vCPUs). No fixed-load windows, no CDF pass.
# Copy of eval.conf's global and vector DB sections (RecSys and H3 keys dropped) + H2N_* keys. Use: EVAL_CONF=<this file>
# with runset-h2n.sh only (RUNSETS). Format, [run] / [later] marks and path rules as eval.conf (evalconf.py).
# config_sha256(h2n) = vdb keys + H2N_* keys (evalconf.py sha h2n); file keys hash their file (a pending
# PLACEHOLDER value hashes as text: the hash changes once the other agent's Megalon outputs are filled in).

# ---- global ----
RUNS=3                                   # [run] runs per N (evaluation plan 2026-10-20: runs 1-3)
LEVELS_FROM_RUN=1                        # unused by h2n (no fixed-load levels); required by evalconf.py
RESULTS_ROOT=recovery                    # [run] raw evidence (immutable)
DERIVED_ROOT=workspaces/popcorn-lock-split/derived/lock # [run] lock_split_report.py output
REGISTRY=workspaces/popcorn-lock-split/derived/lock-split-runs.tsv   # [run] this experiment's runs.tsv
RUNSETS="h2n-n8"                         # [run] N = 8 only
EVIDENCE_PREFIX=popcorn-writer-lock-split   # [run] unused (H2N_EVIDENCE_NAME)
H2N_EVIDENCE_NAME=popcorn-writer-lock-split # [run] evidence recovery/popcorn-writer-lock-split-v<V>
SEED_BASE=20261020                       # loadgen seed of run k = SEED_BASE + k (as the 2-VM run sets)
VCPUS_PER_VM=4                           # user 2026-10-20: every VM 4 vCPU; threads = vCPUs: 3 search + 1 writer
REGION=CXL_SWMC/config/cxl_region-ring2m.yaml   # 2 MiB Popcorn ring in every lifetime
EXPECT_DAX_UUID=3d40b5e0-dcaf-427f-bb9b-04fd6c8be26f   # devdax restore v3 (2026-10-28); runs before that: f61e87a2-aaa7-41a7-94d9-5e74fe078049
POP_K=6.14.0-famfs-de-stijl+-ds-popcorn-new-12
POP_C=workspaces/popcorn-n/bundle-n-v2
POP_GT=/home/comsys/popcorn-12n
POP_BUNDLE_SHA=88692448ee780398254b5683f07af35769dc1156d778cd50def0b049a1505436
POP_BUILD=12
RECV_MODE=sleep                          # user 2026-10-20 22:3x: Popcorn recv_mode=sleep for all future runs
MEG_LIB=builds/megalon/77                # N = 2 Megalon library (pins-vdb.sh); per-N libraries: H2N_MG_LIB_N<N>

# ---- vector DB (eval.conf values; pins-vdb.sh verifies the builds, data, region and the N = 2 Megalon config) ----
VDB_POINTS="u10 u50 u90"                 # user 2026-10-22: u10 replaces u5 (both hypotheses: u10 u50 u90)
VDB_MG_POINTS="u10 u50 u90"
VDB_SYSTEMS="hw pop mg"
VDB_SLO_PCT=99
VDB_SLO_MS=100
VDB_RAMP_START_MAP="u10:10 u50:10 u90:10"
VDB_DATASET=28m-x
VDB_X_DATA=builds/vdb-inputs/3/pubmed-a27m-b3400k-q10k
VDB_X_WRITES=builds/vdb-inputs/3/writes-a27m-b3400k-u3400k.bin
VDB_X_NB=3400000
VDB_X_MAXIDS=30470752
VDB_X_MAXW=6815744
VDB_X_MAXD=1835008                       # 2-VM value; per N: H2N_MAXD_N<N>
VDB_X_INIT_CAP=875000
VDB_MG_CAPACITY=h1                       # Megalon keeps the 28M capacity (--max-ids 28000000 --max-writes 2097152)
VDB_PLAIN_BUILD=builds/vdb/21             # branch popcorn-lock-split (vdb/18 + VDB_LOCK_SPLIT counters)
VDB_VPLAIN=/home/comsys/vdb21r2m          # guest install dir of builds/vdb/21 (the chain installs it on vm0 / vm1)
VDB_MEG_BUILD=builds/vdb-megalon/14       # UNUSED by h2n (fp32-era 2-VM key kept for evalconf; h2n uses H2N_MG_BUILD_N*)
VDB_VMEG=/home/comsys/vdbm14r2m           # UNUSED by h2n (h2n uses H2N_VMEG_N*)
VDB_MEG_CFG=CXL_SWMC/systems/megalon/vectordb-2vm.yaml
VDB_LOADGEN_BUILD=builds/vdb-loadgen/12  # runs123 d8872c050: loadgen/11 + --overload-base, --start-fail-steps

# ---- h2n (run sets "h2n-n<N>": h2n-block.sh; RUN-H2N.md) ----
H2N_NODES="8"                            # N = 8 only
H2N_TOPO=8                               # libvirt topology: the VM8 XMLs (vmN-xml.py --n 8 --vcpus 4 --ram-gib 24)
H2N_RAM_GB=24                            # per VM (fixed)
H2N_POINTS="u90"                         # u90 only
H2N_SYSTEMS="pop"               # execution order within an N: the two systems without cxl_shm first (dax0.0
                                         # owned by comsys), Popcorn (cxl_shm load / teardown per lifetime) last
H2N_SLO_PART="--mode slo --start 10 --factor 1.5 --precision 0.02 --confirm-precision 0.01 --max-confirm-probes 6 --confirm-step-down 0.05 --max-steps 25 --warmup-s 10 --step-warmup-s 3 --step-measure-s 15 --confirm-s 30 --confirm-reps 3"
# writes files: same seed, ids and order for every N, targets drawn over the N VMs (total deletes 3,400,000)
H2N_WRITES_N2=builds/vdb-inputs/3/writes-a27m-b3400k-u3400k.bin
H2N_WRITES_N4=builds/vdb-inputs/4/writes-a27m-b3400k-u3400k-vms4.bin
H2N_WRITES_N8=builds/vdb-inputs/4/writes-a27m-b3400k-u3400k-vms8.bin
# delete log per node (backend.h:34-35): total capacity constant = 2 x 1835008 entries; h2n_layout.py checks the fit
# (swcc_used_end 103045660672 of 103060340736 at every N) and that each VM's share of the deletes fits its node log
H2N_MAXD_N2=1835008
H2N_MAXD_N4=917504
H2N_MAXD_N8=458752
# Megalon per N (megalon-n agent, workspaces/megalon-n/): library with LOGICAL_NODE_NUM = N, vdb-megalon build on it,
# guest install dir (on vm0 before the topology freeze: guests 2..7 are overlays of vm0), Megalon config;
# max-deletes per node scaled as the plain backend (total 2 x 1048576 entries)
H2N_MG_LIB_N2=builds/megalon/78-n2            # constants_h_LOGICAL_NODE_NUM=2, NR log entry 128 B (18ba703 = f9837d7 code)
H2N_MG_BUILD_N2=builds/vdb-megalon/16-n2      # branch vdb-sq8 server on megalon 78-n2 (same source as builds/vdb/18)
H2N_VMEG_N2=/home/comsys/vdbm16r2m-n2
H2N_MG_CFG_N2=CXL_SWMC/systems/megalon/vectordb-2vm.yaml
H2N_MG_MAXD_N2=1048576
H2N_MG_LIB_N4=builds/megalon/78-n4            # constants_h_LOGICAL_NODE_NUM=4, NR log entry 192 B
H2N_MG_BUILD_N4=builds/vdb-megalon/16-n4
H2N_VMEG_N4=/home/comsys/vdbm16r2m-n4
H2N_MG_CFG_N4=CXL_SWMC/systems/megalon/vectordb-4vm.yaml
H2N_MG_MAXD_N4=524288
H2N_MG_LIB_N8=builds/megalon/78-n8            # constants_h_LOGICAL_NODE_NUM=8, NR log entry 256 B
H2N_MG_BUILD_N8=builds/vdb-megalon/16-n8
H2N_VMEG_N8=/home/comsys/vdbm16r2m-n8
H2N_MG_CFG_N8=CXL_SWMC/systems/megalon/vectordb-8vm.yaml
H2N_MG_MAXD_N8=262144
H2N_OPCOH_STRICT=0                       # 1 = opcoh_check (N nodes) FAIL stops the block; 0 = recorded as a NOTE
H2N_CXLBW=0                         # CXL.mem bandwidth sampler per block (experiments/eval/cxl-bw-sampler.sh of
                                         # the code tree: starts after the lock, stops itself at the unlock)
H2N_HOSTCPU=1                            # Host CPU sampler per block (experiments/eval/host-cpu-sampler.py, read only:
                                         # QEMU emulator / vhost threads of each VM, loadgen, their Host CPUs; 1 s)
# ---- SQ8 (h2n-block.sh / runset-h2n.sh overlay keys; absent in h2n.conf = fp32, ef 32, the fp32 image) ----
H2N_VEC_FORMAT=sq8                       # server --vec-format for hw, pop and mg alike
H2N_EF=32                                # query ef 32 (user 2026-11-01: vector DB = 54M SQ8 at ef 32 for every experiment from now on; recall@10 0.965 on the 54M index, bytes/query 20.8 MB = 0.61 x ef 64; was 64 since 2026-10-30, 24 before)
                                         # index: 0.9571 (workspaces/vdb-sq8/scratch/sweep-28m-sq8.txt, 1000 queries, exact fp32 GT)
H2N_INIT=/home/comsys/vdb/init/seg32c32m-a27m-sq8   # guest copy of H2N_HOST_IMAGE on vm0 (main session copies it)
H2N_HOST_IMAGE=builds/vdb-index-sq8/1/seg32-c32m-a27m-m16-efc128-sq8   # 28M SQ8 initial segments (SHA256SUMS)
H2N_PINS=pins-vdb-sq8-lg12-ls21.sh       # = pins-vdb-sq8-lg12.sh with the builds/vdb/21 hashes
# ---- popcorn-writer-lock-split windows (design §3; h2n-block.sh H2N_FIXED tokens
# <sys>/<part>/<detail>/<recv>/<rates>/<warmup>/<measure>/<drain>): part det = 577 (common load), 939 (knee), 985
# (knee + 5 %) at instr/detail = 1; lsleep / lspin = 10 ops/s at detail 0 with recv_mode sleep / poll
H2N_FIXED="pop/det/1/-/577,939,985/15/90/5 pop/lsleep/0/sleep/10/15/90/5 pop/lspin/0/poll/10/15/90/5"
H2N_NODE_ENV_EXTRA="ENV:VDB_LOCK_SPLIT=1"   # every server: lock split counters on (builds/vdb/21)
H2N_ALLOW_DETAIL=1                       # user-approved for this experiment: detail written per part, restored to 0;
                                         # m4-precheck.sh's detail = 0 check skipped (PRECHECK_ALLOW_DETAIL)
