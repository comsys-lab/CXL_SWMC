# eval3-rs-c400r200.conf = eval3-rs-c400r.conf with its own evidence prefix / registry / derived root (eval3-c400r200:
# never collides with the C400 dirs recovery/eval3-c400-run1-* or runs-c400.tsv). Used only for the C400 ds part at the
# receiver 200 / 50 (chain workspaces/de-stijl-evaluation-run1-c400r-chain-v2.sh); hw / pop / mg = eval3-rs-c400.conf.
# eval3-rs-c400r.conf = eval3-rs-c400.conf + RS_DS_RECV_EXTRA="idle_sleep_us=200 idle_spin_us=50" (USER DECISION 2026-11-02
# 17:0x: the De Stijl receiver sleep tier 200 / 50 us for every ds cell measured from now on, after block R200; Popcorn and
# hw unchanged). Original header follows.
# eval3 block C at SLO 400 ms ("C400"; experiment de-stijl-evaluation-run1): USER DECISION 2026-11-02 ~10:2x: RecSys SLO at
# 4 vCPU = query p95 <= 400 ms (100 ms was set at 16 vCPU; 100 ms x 16 / 4 vCPU; DeepRecSys DLRM-RMC targets are "hundreds
# of ms"). = eval3-rs-c.conf except RS_SLO_MS=400 (lib.sh rs_env -> main-block.sh STREAM_SLO_MS=400) and its own
# evidence prefix / registry / derived root (eval3-c400: never collides with block C's eval3-c-run1-* dirs and exports).
# Block C (SLO 100 ms) had no max under the SLO in any RecSys cell (recovery/eval3-c-run1-rs-{main,ds}-v1); this re-runs
# every cell with the full SLO search at 400 ms. Chain: workspaces/de-stijl-evaluation-run1-c400-chain-v1.sh.
# --- header of eval3-rs-c.conf (unchanged otherwise) ---
# eval3 block C (experiment de-stijl-evaluation-run1; reports/experiments/de-stijl-evaluation-run1-schedule.md §2 RecSys,
# §4 block C): RecSys v6 streaming, 2 hosts x 4 vCPU (cxl_vm0/1, guest CPUs 4-15 offline), update rates 50 / 200 / 400
# trace samples/s, SLO query p95 <= 400 ms (C400), ramp from 1 q/s (memory recsys-methodology; BLOCK=stream).
# One config, three run sets, two kernels (the chain fragment workspaces/eval3/recsys-ds/block-c.sh runs them):
#   part hw/pop/mg (Popcorn guest kernel POP_K, T-independent):  runset-rs-main.sh 1 (hw, pop)  + runset-rs-h1.sh 1 (mg floor)
#   part ds (De Stijl guest kernel RS_DS_K, needs the main T):     runset-rs-ds.sh 1 with a resolved copy of this file
#     (RS_DS_T_US=@MAIN_T@ -> the vector DB main T in us; block-c.sh writes the copy, this file keeps the placeholder)
# Differences from eval.conf: RUNS 1, own prefix / registry / derived root, RUNSETS, VCPUS_PER_VM 4 (threads = vCPUs:
# node 0 4 update threads, node 1 4 serving threads), devdax uuid 45fd85d6 (restore v4), RECV_MODE sleep (user
# 2026-10-20 22:3x, every run) + RS_PROC_CXL_SHM 1 (per-step receive counters for recv_check --mode sleep), Popcorn
# build 13 (N-node bundle; fallback build 12 below), RS_POINTS 50 200 400, no fixed-load windows (RS_FIX_LEVELS,
# RS_MG_COMPARE_Q, RS_FIX_FALLBACK_Q empty: the 1 q/s start step of every SLO search is the L1 step, schedule §1),
# Megalon = one probe lifetime at 50 samples/s (1 q/s window, RS_MG_MGOFF 0: no mgoff), RecSys build 14 (libdestijl;
# the same binary for every system) at /home/comsys/rs14r2m (ring2m region; hw, pop) and /home/comsys/rs14ds (De Stijl
# region; ds), + the RS_DS_* keys of runset-rs-ds.sh.
# Re-pin Popcorn to build 12 (if build 13 is not deployed before block C): POP_K=6.14.0-famfs-de-stijl+-ds-popcorn-new-12
#   POP_C=workspaces/popcorn-n/bundle-n-v2 POP_GT=/home/comsys/popcorn-12n POP_BUILD=12
#   POP_BUNDLE_SHA=88692448ee780398254b5683f07af35769dc1156d778cd50def0b049a1505436 (also the De Stijl rollback target).
# Re-pin De Stijl to another bundle of build 7 (only if p-destijl-shm.sh / tools change): RS_DS_C=<dir>,
#   RS_DS_BUNDLE_SHA=$(sha256sum < <dir>/packet.sha256), RS_DS_GT = the GT the deploy used; RS_DS_REGION must equal
#   <dir>/tools/cxl_region.yaml (runset-rs-ds.sh checks every pin; a dry start shows a wrong one).
# Measured staleness of ds (stale-read share, SS residence p95): workspaces/eval3/recsys-ds/PROGRESS.md "Staleness".
# Format: KEY=value or KEY="v1 v2" per line, no shell expansion (evalconf.py). Paths without a leading / are relative
# to P=/home/comsys/sungsu/destijl-control. [run] keys are bookkeeping (not in config_sha256).

# ---- global ----
RUNS=1                                   # [run] one run per experiment (schedule §0)
RUNSETS="rs-main rs-h1 rs-ds"            # [run] run sets this config may drive (lib.sh)
LEVELS_FROM_RUN=1                        # required by evalconf.py; no fixed-load levels in this config
RESULTS_ROOT=recovery                    # [run] raw evidence (immutable)
DERIVED_ROOT=workspaces/eval3-derived/c400r200   # [run] canonical CSVs: <root>/recsys/<runset>/run1/
REGISTRY=workspaces/eval3-derived/runs-c400r200.tsv   # [run] this block's runs.tsv (registry.py EVAL_REGISTRY)
EVIDENCE_PREFIX=eval3-c400r200           # [run] recovery/eval3-c400r200-run1-rs-ds-v<N> (never eval3-c400-run1-*)
SEED_BASE=20261020                       # loadgen seed = SEED_BASE + k (as every earlier run set)
VCPUS_PER_VM=4                           # threads = vCPUs (user 2026-10-20); guests at 4 vCPU (user 2026-11-01)
REGION=CXL_SWMC/config/cxl_region-ring2m.yaml   # hw / pop / mg lifetimes (2 MiB Popcorn ring; = POP_C/tools/cxl_region.yaml)
EXPECT_DAX_UUID=45fd85d6-724d-4eee-8aad-d5152add019d   # devdax restore v4 (2026-11-01)
# Popcorn build 13 N-node bundle (rel/popcorn-new-13, 7e7bb6563; cxl_shm 13.0) deploy-v2 = deployed on both VMs
# (eval3-pop13-deploy-chain-v2.sh; deploy-v1 never installed); POP_GT = the guest tools dir of that deploy
POP_K=6.14.0-famfs-de-stijl+-ds-popcorn-new-13
POP_C=builds/popcorn_new/13/deploy-v2
POP_GT=/home/comsys/popcorn-13
POP_BUNDLE_SHA=60baa46ba48b5e0d7dab2dd0c3c43f51cd52c60e9ac3be6e1332237db7eb2dec
POP_BUILD=13
RECV_MODE=sleep                          # user 2026-10-20 22:3x: Popcorn recv_mode=sleep for all runs (De Stijl: same)
RS_PROC_CXL_SHM=1                        # RecSys servers also snapshot /sys/kernel/cxl_shm per step (recv_check --mode sleep)
MEG_LIB=builds/megalon/77

# ---- RecSys (run sets rs-main: hw, pop; rs-h1: Megalon; rs-ds: De Stijl) ----
RS_POINTS="50 200 400"                   # streaming update rates, trace samples/s (schedule §2: Ekko avg -> 50, peak -> 400)
RS_MG_POINTS="50"                        # Megalon floor: one probe lifetime (1 q/s window) at the lowest rate (~5 min)
RS_SYSTEMS="hw pop"
RS_SLO_PCT=95                            # fixed in main-block.sh BLOCK=stream; checked, not passed
RS_SLO_MS=400                            # user 2026-11-02 (4 vCPU): passed as STREAM_SLO_MS=400 (lib.sh rs_env); mg probe rule too
RS_RAMP_START=1                          # fixed in BLOCK=stream (--start 1); recorded
RS_H3_POINT=200                          # unused here (H3 run sets only)
RS_FIX_LEVELS=                           # no fixed-load windows (schedule §1: the L1 step = the 1 q/s start step)
RS_FIX_FALLBACK_Q=
RS_MG_COMPARE_Q=
RS_FIX_SEP=1
RS_LATER_FIX_SEP=1                       # [later] unused (RUNS 1)
RS_FIX_S=60                              # window length per level (s); unused without levels except the Megalon probe
RS_FIX_SETTLE_S=60                       # discarded settle before the probe window (s)
RS_MG_FIX_LEVELS="1"                     # Megalon window: 1 q/s
RS_MG_PROBE_Q=1                          # [later] Megalon probe window (q/s)
RS_MG_SLO=auto                           # [later] auto: an mg SLO search only where the probe p95 <= RS_SLO_MS and the stream is valid
RS_MG_MGOFF=0                            # no mgoff lifetime (C_diff not needed for the floor; runset-rs-h1.sh)
RS_LOW_RAMP_FACTOR=                      # [later] off
RS_PLAIN_BUILD=builds/recsys/14          # libdestijl recsys-server (commit e40bc920a); the same binary for hw, pop and ds
RS_VM_PLAIN=/home/comsys/rs14r2m         # guest install of builds/recsys/14 with REGION (rs14ds-install.sh, part hwpop)
RS_MEG_BUILD=builds/recsys-megalon/15    # live 2f94042dc on megalon/77 (--update-mode stream)
RS_VM_MEG=/home/comsys/rsm15r2m
RS_MEG_CFG=CXL_SWMC/systems/megalon/recsys-2vm.yaml
RS_MEGALON_BASE=builds/megalon/77
RS_LOADGEN=builds/recsys-loadgen/12/loadgen
RS_INPUTS=builds/recsys-inputs/1
RS_MG_RPO_OPT=--mg-rows-per-object
RS_MG_TABLE_N=0                          # one object per whole table (user 2026-10-20)
RS_MG_COH_SAMPLE=64                      # user 2026-10-20
RS_XT=7200
# De Stijl v2 build 7 (runset-rs-ds.sh); RS_DS_C only provides p-destijl-shm.sh + tools/cxl_region.yaml, byte-identical
# in every build-7 bundle, so deploy-v7 stays the pin whichever deploy-v<n> the block chain deploys (the chain checks
# it); T = the vector DB main T in us (user 2026-11-01 23:2x: RecSys ds T = vdb main T)
RS_DS_C=builds/destijl/7/deploy-v7
RS_DS_BUNDLE_SHA=589e2ec0c2065d897b34e0d5c05e2b5e934629831b8eb03c821c44b9611e02f9
RS_DS_K=6.14.0-famfs-de-stijl+-ds-destijl-7
RS_DS_GT=/home/comsys/destijl-7
RS_DS_REGION=CXL_SWMC/config/cxl_region-destijl.yaml
RS_DS_VM_PLAIN=/home/comsys/rs14ds
RS_DS_T_US=@MAIN_T@                      # placeholder: block-c.sh resolves it (0 / 1000 / 100000 / 10000000)
RS_DS_RECV_EXTRA="idle_sleep_us=200 idle_spin_us=50"   # De Stijl receiver sleep tier (user 2026-11-02 17:0x; defaults 20 / 50)
