# experiment vector-db-staleness-recall (approved 2026-11-13; design reports/experiments/vector-db-staleness-recall.md;
# workloads/vectordb/DESIGN.md §20). Driver: experiments/vectordb/staleness-block.sh (parts pilot / measure), which
# runs experiments/eval/h2n-block.sh with ONE fixed-window All-HWcc lifetime (hw:u0) on cxl_vm0 + cxl_vm1. The values
# below are the run-2 hw cell's (eval-run2-vdb.conf: server builds/vdb/24, 54M SQ8 image, ef 32, 32 segments,
# region ring2m, guest install /home/comsys/vdb24r2m, 2 VMs x 4 vCPU, Popcorn 13 kernel on the guests) except:
#   - loadgen builds/vdb-loadgen/13 (stale_ms / search_target / stale.bin), writes builds/vdb-inputs/6 (= inputs/5 with
#     every target 0: all updates to vm0), H2N_WRITES_TARGETS=0;
#   - H2N_PLAIN_SERVER_EXTRA="--writer-threads 4" (the existing server flag, DESIGN.md §17; the same SERVER_ARGS on both
#     nodes: vm1 receives no update, its writer threads stay idle; urate_check.py --writers 4);
#   - no SLO search, no L1 / pmax / Popcorn lifetimes (hw only; the Popcorn keys stay because h2n-block.sh verifies the
#     bundle and the guest release of the current kernel).
# Format: KEY=value per line (evalconf.py). [run] keys are bookkeeping.
