# Megalon config for the vectordb Megalon backend with 4 KiB-page objects (experiment megalon-page-granularity,
# reports/experiments/megalon-page-granularity.md), 2 VMs. Identical to vectordb-2vm.yaml except the sizing comments:
# vdb-server --chunk-bytes 4096 --vec-format sq8 = 4 records (832 B) per group; vector object 3,328 B, link object
# 1,792 B (4 level-0 blocks + 8 upper-level blocks, shm_hnsw.h small groups). Run-2 parameters (57.4M ids, 32 segments,
# 448,438 groups per segment, 2 x 1M deletes): 28,700,544 objects, object_bytes 73,606,299,648 B = 68.55 GiB
# (tests/page_layout_test.cc; vdb-server prints "object_bytes=" in its backend line); object_arena_size stays 90GB
# (the run-2 value, GiB units: 88.93 GiB fit in it), so the arena placement on the device is the same as run 2.
# Known limits for this object count (PROGRESS.md "Page granularity"): 28.7M ObjectCreate log appends (nr_log_size
# 64MB = 524,288 entries, wraps ~55x; node 1 must keep replaying), coherence-record pool 16,777,216 records
# (logical_scr_size 64MB) < 27.4M data objects (reclaim once every object was written), stuck_timeout_ms 10000.
# They are left as in run 2 (methodology: same Megalon configuration); the pilot measures init time.
mount_directory: /mydata        # required by the config parser; unused
key_space: 10000
slots: 10240
logical_scr_size: 64MB
node_id: 0                      # overridden by MEGALON_NODE_ID (vdb-server sets it from --node)
region_config: ""               # $CXL_REGION_CONFIG
reinit: false                   # node 0: MEGALON_REINIT=1
attach_mprotect: true
stuck_timeout_ms: 10000
log_sync_interval_us: 100
nr_log_size: 64MB
attach_timeout_s: 600
start_barrier_timeout_s: 600
object_arena_size: 90GB
object_align: 64
object_max_count: 65536         # hwcc flavor only (static records); unused by the megalon flavor
replicate: false
flush: false
evict: false
partition_ratio: 0.0
excluded_files:
excluded_directories:
  - /usr
  - /proc
  - /etc
  - /dev
  - /sys
