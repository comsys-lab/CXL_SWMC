# Megalon config for the vectordb Megalon backend (workloads/vectordb/DESIGN.md §12), 2 VMs.
# Same file on both VMs; node id, run id and region config come from vdb-server (--node, --run-id, --region).
# Only objects are used (no kv Put/Get), so key_space/slots stay small. object_arena_size must hold every object:
# vdb-server prints "object_bytes=" in its backend line (28M ids, 32 segments, 82 groups, 32 MiB chunks,
# 2 x 1M deletes: 88.05 GiB; 2 x 8M deletes: 88.93 GiB). Earlier 2M-id runs used 8GB.
mount_directory: /mydata        # required by the config parser; unused
key_space: 10000
slots: 10240
logical_scr_size: 64MB
node_id: 0                      # overridden by MEGALON_NODE_ID (vdb-server sets it from --node)
region_config: ""               # $CXL_REGION_CONFIG
reinit: false                   # node 0: MEGALON_REINIT=1
attach_mprotect: true
stuck_timeout_ms: 10000
log_sync_interval_us: 100
nr_log_size: 64MB
attach_timeout_s: 600
start_barrier_timeout_s: 600
object_arena_size: 90GB
object_align: 64
object_max_count: 65536         # hwcc flavor only (static records): >= object count (vdb-server prints objects=)
replicate: false
flush: false
evict: false
partition_ratio: 0.0
excluded_files:
excluded_directories:
  - /usr
  - /proc
  - /etc
  - /dev
  - /sys
