# Megalon config for the vectordb Megalon backend (workloads/vectordb/DESIGN.md §12), 4 VMs (vector DB VM-count
# scaling). Needs a 4-node Megalon build (LOGICAL_NODE_NUM 4: systems/megalon/build.sh --nodes 4) and vdb-server
# --nodes 4. Same values as vectordb-2vm.yaml; only the node count differs.
# Same file on every VM; node id, run id and region config come from vdb-server (--node, --run-id, --region).
# object_arena_size must hold every object: 28M ids, 32 segments, 82 groups, 32 MiB chunks, per-node delete logs
# (h2n runs vdb-server --max-deletes 524288 per node, h2n.conf H2N_MG_MAXD_N4: 128 chunks x 256 KiB per node):
# object_bytes = 94410596352 + 4 x 33554432 = 94544814080 B (88.05 GiB, 5760 objects, = the 2-VM total) of
# 96636764160 (90 GiB); with 1048576 per node it would be 94679031808 B (88.18 GiB, 6272 objects), still fitting. NR log: 64 MiB -> 349525 entries of 192 B, rounded up to
# 524288 entries = 96 MiB of SWcc (same entry count as 2 VMs).
mount_directory: /mydata        # required by the config parser; unused
key_space: 10000
slots: 10240
logical_scr_size: 64MB
node_id: 0                      # overridden by MEGALON_NODE_ID (vdb-server sets it from --node)
region_config: ""               # $CXL_REGION_CONFIG
reinit: false                   # node 0: MEGALON_REINIT=1
attach_mprotect: true
stuck_timeout_ms: 10000
log_sync_interval_us: 100
nr_log_size: 64MB
attach_timeout_s: 600
start_barrier_timeout_s: 600
object_arena_size: 90GB
object_align: 64
object_max_count: 65536         # hwcc flavor only (static records): >= object count (vdb-server prints objects=)
replicate: false
flush: false
evict: false
partition_ratio: 0.0
excluded_files:
excluded_directories:
  - /usr
  - /proc
  - /etc
  - /dev
  - /sys
