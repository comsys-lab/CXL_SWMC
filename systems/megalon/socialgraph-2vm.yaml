# Megalon config for the socialgraph Megalon backend, data structure granularity (sg-server --backend megalon
# --object-layout chunk --chunk-bytes 33554432; workloads/socialgraph/server/megalon_backend.h; experiment
# socialgraph-serving §2), 2 VMs. Megalon build builds/megalon/78-n2 (sg build builds/socialgraph-megalon/<n>-n2).
# Region: config/cxl_region-ring2m.yaml (as every system; the SCR below fits its 256 MiB hwcc).
# Same file on both VMs; node id, run id and region config come from sg-server (--node, --run-id, --region).
# Values as systems/megalon/vectordb-2vm.yaml (run 2) except object_arena_size.
# Sizing from image build 1 (builds/socialgraph-image/1, 10,729,869,312 B; sg-server --print-megalon-objects
# --image graph.img --object-layout chunk):
#   chunks of 32 MiB per array: nodes 527,513,856 B -> 16, adj 6,238,133,504 B -> 186, ovf 3,931,242,496 B -> 118
#   = 320 chunk objects (<= 33,554,432 B each) + 1 meta object (header page + adj_index = 32,973,712 B; read once by
#   every node at attach, never in the run) = 321 objects, object_bytes 10,729,863,616 B = 9.99 GiB (64 B aligned)
#   object_arena_size 11GB = 11,811,160,064 B (margin 1,081,296,448 B).
# Coherence-record pool: 321 objects need ceil(321 / 0.9) = 357 records; 64MB = 16,777,216 records (run 2 value).
# hwcc: SCR 64 MiB + 14,848 B + sg app 1,052,672 B (sg-server --print-app-bytes --nodes 2) + msg_ring 2 MiB
#   = 70,273,536 B <= 268,435,456 B (ring2m hwcc).
# NR log 64MB = 524,288 entries of 128 B (run 2); init appends 321 creates + 321 first writes.
# swcc need: 11GB arena + NR log + slot data << 102.8 GB swcc of ring2m.
mount_directory: /mydata        # required by the config parser; unused
key_space: 10000
slots: 10240
logical_scr_size: 64MB
node_id: 0                      # overridden by MEGALON_NODE_ID (sg-server sets it from --node)
region_config: ""               # $CXL_REGION_CONFIG
reinit: false                   # node 0: MEGALON_REINIT=1
attach_mprotect: true
stuck_timeout_ms: 10000
log_sync_interval_us: 100
nr_log_size: 64MB
attach_timeout_s: 600
start_barrier_timeout_s: 600
object_arena_size: 11GB
object_align: 64
object_max_count: 65536         # hwcc flavor only (static records); unused by the megalon flavor
replicate: false
flush: false
evict: false
partition_ratio: 0.0
excluded_files:
excluded_directories:
  - /usr
  - /proc
  - /etc
  - /dev
  - /sys
